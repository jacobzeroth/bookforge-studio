<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="BookForge Studio — a local-first professional book writing and publishing workspace.">
<title>BookForge Studio</title>
<link rel="stylesheet" href="css/styles.css?v=20261023e">
<noscript>
  <div class="boot-error"><b>JavaScript is disabled.</b> BookForge Studio requires JavaScript. Enable it for this page and reload.</div>
</noscript>
</head>
<body>
<a class="skip-link" href="#view">Skip to manuscript</a>

<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="btnSidebar" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="true">
        <span class="bars" aria-hidden="true"></span>
      </button>
      <div class="brand" aria-label="BookForge Studio">
        <span class="brand-mark">B</span>
        <span class="brand-word">BOOKFORGE <em>STUDIO</em></span>
      </div>
      <div class="book-id">
        <span class="book-id-title" id="topBookTitle">No book open</span>
        <span class="book-id-sub" id="topBookSub">Local-first workspace</span>
      </div>
    </div>

    <div class="topbar-right">
      <span class="save-status" id="saveStatus" role="status" aria-live="polite" data-state="saved">
        <span class="save-dot" aria-hidden="true"></span><span id="saveText">Saved</span>
      </span>

      <button class="save-status sync-status" id="syncStatus" type="button" title="Cloud sync is off — click to connect" aria-label="Cloud sync" data-state="off">
        <span class="sync-dot" aria-hidden="true"></span><span id="syncText">Sync off</span>
      </button>

      <div class="tool-cluster" role="group" aria-label="History">
        <button class="icon-btn" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
        <button class="icon-btn" id="btnRedo" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
      </div>

      <button class="icon-btn" id="btnSearch" title="Search manuscript (Ctrl+F)" aria-label="Search manuscript">&#9906;</button>

      <label class="sr-only" for="modeSelect">Writing mode</label>
      <select id="modeSelect" class="mode-select" title="Writing mode">
        <option value="studio">Studio</option>
        <option value="focus">Focus</option>
        <option value="typewriter">Typewriter</option>
        <option value="reading">Reading</option>
      </select>

      <div class="menu-wrap">
        <button class="btn ghost" id="btnExportMenu" aria-haspopup="menu" aria-expanded="false">Export</button>
        <div class="menu" id="exportMenu" role="menu" hidden>
          <button role="menuitem" data-export="docx">Word document (.docx)</button>
          <button role="menuitem" data-export="epub">EPUB 3 (.epub)</button>
          <button role="menuitem" data-export="pdf">PDF (print dialog)</button>
          <button role="menuitem" data-export="html">Web book (.html)</button>
          <button role="menuitem" data-export="md">Markdown (.md)</button>
          <button role="menuitem" data-export="txt">Plain text (.txt)</button>
          <button role="menuitem" data-export="json">Project backup (.json)</button>
          <hr>
          <button role="menuitem" data-export="preflight">Run preflight report</button>
        </div>
      </div>

      <button class="btn ghost" id="btnPrint" title="Print / Print to PDF">Print</button>
      <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">&#9881;</button>
      <button class="avatar-btn" id="btnProfile" title="Author profile" aria-label="Author profile"><span id="avatarLetter">A</span></button>
      <button class="icon-btn mobile-only" id="btnMobileMore" title="More" aria-label="More options" aria-haspopup="menu" aria-expanded="false">&#8943;</button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <div class="nav-backdrop" id="navBackdrop" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <button class="new-book-btn" id="btnNewBookSide"><span aria-hidden="true">+</span> New book</button>
        <p class="local-note">Local workspace · saved in this browser</p>
      </div>
    </aside>

    <main id="main" class="main" tabindex="-1">
      <section id="view" aria-label="Workspace content"></section>
    </main>

    <aside class="context-panel" id="context" aria-label="Context panel"></aside>
  </div>

  <footer class="statusbar">
    <div class="status-left">
      <span id="stChapter">No chapter</span>
      <span class="sep" aria-hidden="true">·</span>
      <span id="stWords">0 words</span>
      <span class="sep" aria-hidden="true">·</span>
      <span id="stChars">0 characters</span>
      <span class="sep" aria-hidden="true">·</span>
      <span id="stRead">0 min read</span>
    </div>
    <div class="status-right">
      <span id="stTarget">Target 0 words</span>
      <span class="sep" aria-hidden="true">·</span>
      <span id="stPage">—</span>
      <label class="sr-only" for="zoomRange">Zoom</label>
      <input id="zoomRange" class="zoom" type="range" min="80" max="140" step="5" value="100" title="Zoom">
      <span id="stZoom">100%</span>
    </div>
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="overlay" class="overlay" hidden></div>
<div id="print-root" class="print-root" aria-hidden="true"></div>
<div id="measure" class="measure" aria-hidden="true"></div>

<script src="js/util.js?v=20261023e"></script>
<script src="js/zip.js?v=20261023e"></script>
<script src="js/model.js?v=20261023e"></script>
<script src="js/storage.js?v=20261023e"></script>
<script src="js/editor.js?v=20261023e"></script>
<script src="js/layout.js?v=20261023e"></script>
<script src="js/export.js?v=20261023e"></script>
<script src="js/image-editor.js?v=20261023e"></script>
<script src="js/text-tools.js?v=20261023e"></script>
<script src="js/sync.js?v=20261112a"></script>
<script src="js/mobile.js?v=20261113a"></script>
<script src="js/views.js?v=20261023e"></script>
<script src="js/app.js?v=20261023e"></script>
<script>
(function () {
  function showBootError(detail) {
    var box = document.getElementById("bfBootError");
    if (!box) {
      box = document.createElement("div");
      box.id = "bfBootError";
      box.className = "boot-error";
      document.body.appendChild(box);
    }
    box.innerHTML = "<b>BookForge Studio could not start.</b><br>" +
      "The interface loaded, but the application scripts did not initialise." +
      (detail ? "<br><code>" + String(detail).replace(/[<>&]/g, "") + "</code>" : "") +
      "<br>Hard-refresh this page with <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> (or reopen the file). " +
      "If it still fails, press <kbd>F12</kbd>, open Console and report the first red error.";
  }
  window.addEventListener("error", function (e) {
    if (window.BF && window.BF.app) return;
    var target = e.target;
    if (target && target.tagName === "SCRIPT") showBootError("Failed to load " + (target.src || "a script"));
    else if (e.message) showBootError(e.message);
  }, true);
  setTimeout(function () {
    if (!window.BF || !window.BF.app || !document.querySelector("#nav button")) {
      showBootError(window.BF ? "" : "The scripts did not run. A browser extension or security policy may be blocking local JavaScript.");
    }
  }, 5000);
})();
</script>
</body>
</html>
