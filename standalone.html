  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "html") node.innerHTML = v;
        else if (k === "dataset") Object.keys(v).forEach(function (d) { node.dataset[d] = v[d]; });
        else if (k.indexOf("on") === 0 && typeof v === "function") node.addEventListener(k.slice(2), v);

        else node.setAttribute(k, v);

    if (mins < 60) return mins + " min ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");

    });

  function diffWords(a, b) {
    var A = String(a || "").split(/(\s+)/);
    var B = String(b || "").split(/(\s+)/);
    var n = A.length, m = B.length;
    var max = 2200;
    if (n > max || m > max) {
      return [{ type: "del", text: String(a || "") }, { type: "add", text: String(b || "") }];
    }
    var dp = [];
    for (var i = 0; i <= n; i++) dp.push(new Int32Array(m + 1));
    for (i = n - 1; i >= 0; i--) {
      for (var j = m - 1; j >= 0; j--) {
        dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);

    var out = [], x = 0, y = 0;
    while (x < n && y < m) {
      if (A[x] === B[y]) { push(out, "same", A[x]); x++; y++; }
      else if (dp[x + 1][y] >= dp[x][y + 1]) { push(out, "del", A[x]); x++; }
      else { push(out, "add", B[y]); y++; }

    while (x < n) { push(out, "del", A[x]); x++; }
    while (y < m) { push(out, "add", B[y]); y++; }

  function sanitizeHtml(html) {

      B: 1, STRONG: 1, I: 1, EM: 1, U: 1, S: 1, STRIKE: 1, DEL: 1, SUB: 1, SUP: 1,
      UL: 1, OL: 1, LI: 1, BLOCKQUOTE: 1, HR: 1, A: 1, IMG: 1, FIGURE: 1, FIGCAPTION: 1,
      TABLE: 1, THEAD: 1, TBODY: 1, TFOOT: 1, TR: 1, TH: 1, TD: 1, CAPTION: 1, MARK: 1, CODE: 1, PRE: 1

  }

  function groupBy(arr, keyFn) {
    return (arr || []).reduce(function (acc, item) {

    }, {});

<script data-src="js/zip.js">
/* BookForge Studio — minimal ZIP writer (STORE method) with CRC-32.
   Used to build genuine DOCX and EPUB containers in the browser. */
(function () {
  "use strict";
  var BF = (window.BF = window.BF || {});

  var CRC_TABLE = (function () {
    var table = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    var c = 0xffffffff;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function utf8(str) {
    return new TextEncoder().encode(String(str));
  }

  function toBytes(data) {
    if (data instanceof Uint8Array) return data;
    if (data instanceof ArrayBuffer) return new Uint8Array(data);
    return utf8(data == null ? "" : data);
  }

  function dosDateTime(date) {
    var d = date || new Date();
    var time = ((d.getHours() & 0x1f) << 11) | ((d.getMinutes() & 0x3f) << 5) | (Math.floor(d.getSeconds() / 2) & 0x1f);
    var day = (((d.getFullYear() - 1980) & 0x7f) << 9) | (((d.getMonth() + 1) & 0xf) << 5) | (d.getDate() & 0x1f);
    return { time: time, date: day };
  }

  function Writer(size) {
    this.buf = new Uint8Array(size);
    this.view = new DataView(this.buf.buffer);
    this.pos = 0;
  }
  Writer.prototype.u16 = function (v) { this.view.setUint16(this.pos, v, true); this.pos += 2; };
  Writer.prototype.u32 = function (v) { this.view.setUint32(this.pos, v >>> 0, true); this.pos += 4; };
  Writer.prototype.bytes = function (b) { this.buf.set(b, this.pos); this.pos += b.length; };
  Writer.prototype.string = function (s) { this.bytes(utf8(s)); };

  /* entries: [{ name, data(string|Uint8Array), date?, unicode? }]
     `stored` (or entry.store === true) disables compression — compression is
     never applied anyway (STORE only), which keeps EPUB `mimetype` valid. */
  function create(entries, options) {
    options = options || {};
    var now = options.date || new Date();
    var prepared = entries.map(function (e) {
      var data = toBytes(e.data);
      var dt = dosDateTime(e.date || now);
      return {
        name: String(e.name),
        nameBytes: utf8(e.name),
        data: data,
        crc: crc32(data),
        time: dt.time,
        date: dt.date
      };
    });

    var localSize = 0, centralSize = 0;
    prepared.forEach(function (e) {
      localSize += 30 + e.nameBytes.length + e.data.length;
      centralSize += 46 + e.nameBytes.length;
    });
    var eocdSize = 22;
    var writer = new Writer(localSize + centralSize + eocdSize);

    prepared.forEach(function (e) {
      e.offset = writer.pos;
      writer.u32(0x04034b50);          // local file header
      writer.u16(20);                  // version needed
      writer.u16(0x0800);              // UTF-8 flag
      writer.u16(0);                   // method: store
      writer.u16(e.time);
      writer.u16(e.date);
      writer.u32(e.crc);
      writer.u32(e.data.length);       // compressed size
      writer.u32(e.data.length);       // uncompressed size
      writer.u16(e.nameBytes.length);
      writer.u16(0);                   // extra length
      writer.bytes(e.nameBytes);
      writer.bytes(e.data);
    });

    var centralStart = writer.pos;
    prepared.forEach(function (e) {
      writer.u32(0x02014b50);          // central directory header
      writer.u16(20);                  // version made by
      writer.u16(20);                  // version needed
      writer.u16(0x0800);              // UTF-8 flag
      writer.u16(0);                   // method: store
      writer.u16(e.time);
      writer.u16(e.date);
      writer.u32(e.crc);
      writer.u32(e.data.length);
      writer.u32(e.data.length);
      writer.u16(e.nameBytes.length);
      writer.u16(0);                   // extra
      writer.u16(0);                   // comment
      writer.u16(0);                   // disk number
      writer.u16(0);                   // internal attributes
      writer.u32(0);                   // external attributes
      writer.u32(e.offset);
      writer.bytes(e.nameBytes);
    });

    writer.u32(0x06054b50);            // end of central directory
    writer.u16(0);
    writer.u16(0);
    writer.u16(prepared.length);
    writer.u16(prepared.length);
    writer.u32(centralSize);
    writer.u32(centralStart);
    writer.u16(0);

    return new Blob([writer.buf], { type: options.mime || "application/zip" });
  }

  BF.zip = { create: create, crc32: function (data) { return crc32(toBytes(data)); } };
})();

    { id: "letter", name: "US Letter (8.5 × 11 in)", w: 215.9, h: 279.4, unit: "mm" },
    { id: "6x9", name: "Trade 6 × 9 in", w: 152.4, h: 228.6, unit: "mm" },
    { id: "5.5x8.5", name: "Digest 5.5 × 8.5 in", w: 139.7, h: 215.9, unit: "mm" },
    { id: "custom", name: "Custom size", w: 210, h: 297, unit: "mm" }
  ];

  var DESIGN_TEMPLATES = [
    { id: "minimal-academic", name: "Minimal academic", bodyFont: "Georgia", headingFont: "Georgia", indent: true, lineHeight: 1.5, chapterOpeners: false, runningHead: true, tableStyle: "rules" },
    { id: "classic-literary", name: "Classic literary", bodyFont: "Georgia", headingFont: "Georgia", indent: true, lineHeight: 1.6, chapterOpeners: true, runningHead: true, tableStyle: "rules", dropCap: true },
    { id: "luxury-nonfiction", name: "Luxury nonfiction", bodyFont: "Georgia", headingFont: "Georgia", indent: false, lineHeight: 1.7, chapterOpeners: true, runningHead: true, tableStyle: "zebra" },
    { id: "modern-business", name: "Modern business", bodyFont: "Segoe UI", headingFont: "Segoe UI", indent: false, lineHeight: 1.55, chapterOpeners: false, runningHead: false, tableStyle: "zebra" },
    { id: "educational-textbook", name: "Educational textbook", bodyFont: "Georgia", headingFont: "Segoe UI", indent: false, lineHeight: 1.6, chapterOpeners: true, runningHead: true, tableStyle: "rules" },
    { id: "workbook", name: "Workbook", bodyFont: "Segoe UI", headingFont: "Segoe UI", indent: false, lineHeight: 1.8, chapterOpeners: true, runningHead: false, tableStyle: "boxed" },
    { id: "training-manual", name: "Professional training manual", bodyFont: "Segoe UI", headingFont: "Segoe UI", indent: false, lineHeight: 1.65, chapterOpeners: true, runningHead: true, tableStyle: "boxed" }
  ];

  var CITATION_STYLES = [
    { id: "apa", name: "APA (7th)" },
    { id: "mla", name: "MLA (9th)" },
    { id: "chicago", name: "Chicago (17th)" },
    { id: "ieee", name: "IEEE" }
  ];

  var SOURCE_TYPES = ["Book", "Journal article", "Chapter in edited book", "Conference paper", "Thesis", "Report", "Web page", "News article", "Dataset", "Other"];

  var FRONT_MATTER = [
    { id: "halfTitle", name: "Half title" },
    { id: "titlePage", name: "Title page" },
    { id: "copyright", name: "Copyright page" },
    { id: "dedication", name: "Dedication" },
    { id: "epigraph", name: "Epigraph" },
    { id: "preface", name: "Preface" },
    { id: "foreword", name: "Foreword" },
    { id: "acknowledgements", name: "Acknowledgements" },
    { id: "toc", name: "Table of contents" },
    { id: "listFigures", name: "List of figures" },
    { id: "listTables", name: "List of tables" }
  ];

  var BACK_MATTER = [
    { id: "conclusion", name: "Conclusion" },
    { id: "appendices", name: "Appendices" },
    { id: "glossary", name: "Glossary" },
    { id: "bibliography", name: "Bibliography" },
    { id: "references", name: "References" },
    { id: "endnotes", name: "Endnotes" },
    { id: "index", name: "Index" },
    { id: "authorBio", name: "About the author" },
    { id: "furtherReading", name: "Further reading" }
  ];

  var NOTE_TYPES = ["Research note", "Character profile", "Topic note", "Chapter idea", "Quotation", "Research question", "To-do", "Reminder"];

  var MANUSCRIPT_FORMATS = ["Prose", "Academic", "Workbook", "Manual", "Mixed"];
  var CATEGORIES = ["Fiction", "Nonfiction", "Academic", "Business", "Self-help", "Education", "Research", "Memoir", "Other"];
  var LANGUAGES = ["English", "Hindi", "Malayalam", "Tamil", "Telugu", "Kannada", "Bengali", "Marathi", "Spanish", "French", "German", "Other"];

  /* --------------------------------------------------------------- factory */
  function defaultDesign(templateId) {
    var t = DESIGN_TEMPLATES.filter(function (d) { return d.id === templateId; })[0] || DESIGN_TEMPLATES[0];
    return {
      template: t.id,
      trim: "a4",
      customWidth: 210,
      customHeight: 297,
      margins: { top: 20, bottom: 20, inside: 22, outside: 16 },
      gutter: 0,
      header: { enabled: true, left: "{title}", right: "{chapter}" },
      footer: { enabled: true, left: "", center: "{page}", right: "" },
      runningHead: t.runningHead,
      chapterOpeners: t.chapterOpeners,
      dropCap: !!t.dropCap,
      bodyFont: t.bodyFont,
      headingFont: t.headingFont,
      bodySize: 11,
      lineHeight: t.lineHeight,
      firstLineIndent: t.indent,
      paragraphSpacing: 0,
      justify: true,
      widowOrphans: true,
      tableStyle: t.tableStyle,
      hyphens: true
    };
  }

  function defaultMatter(template) {
    var front = {}, back = {};
    FRONT_MATTER.forEach(function (m) {
      var on = template && template.front ? !!template.front[m.id] : false;
      front[m.id] = { enabled: on, content: "" };
    });
    BACK_MATTER.forEach(function (m) {
      var on = template && template.back ? !!template.back[m.id] : false;
      back[m.id] = { enabled: on, content: "" };
    });
    return { front: front, back: back };
  }

  function createChapter(title, opts) {
    opts = opts || {};
    var now = Date.now();
    return {
      id: U.uid("ch"),
      title: title || "Untitled chapter",
      content: "",
      partId: opts.partId || null,
      matter: opts.matter || null, // 'front' | 'back' | null
      matterKey: opts.matterKey || null,
      status: "draft",
      order: opts.order == null ? 0 : opts.order,
      createdAt: now,
      updatedAt: now
    };
  }

  function createBook(input) {
    input = input || {};
    var template = TEMPLATES.filter(function (t) { return t.id === input.template; })[0] || TEMPLATES[0];
    var now = Date.now();
    var book = {
      id: U.uid("book"),
      schema: 1,
      title: input.title || "Untitled book",
      subtitle: input.subtitle || "",
      author: input.author || "",
      coAuthors: input.coAuthors || "",
      category: input.category || template.kind || "",
      language: input.language || "English",
      audience: input.audience || "",
      purpose: input.purpose || "",
      publisher: input.publisher || "",
      edition: input.edition || "",
      copyrightYear: input.copyrightYear || String(new Date().getFullYear()),
      isbn: input.isbn || "",
      targetWords: Number(input.targetWords || template.targetWords || 0),
      manuscriptFormat: input.manuscriptFormat || (template.kind === "Textbook" ? "Academic" : "Prose"),
      template: template.id,
      createdAt: now,
      updatedAt: now,
      archived: false,
      trashed: false,
      settings: {
        theme: input.theme || "dark",
        citationStyle: input.citationStyle || "apa"
      },
      design: defaultDesign(template.design),
      parts: [],
      chapters: [],
      matter: defaultMatter(template),
      notes: [],
      sources: [],
      assets: [],
      comments: [],
      trashChapters: [],
      goals: { dailyTarget: 500, deadline: "" }
    };
    (template.chapters || ["Chapter 1"]).forEach(function (t, i) {
      book.chapters.push(createChapter(t, { order: i + 1 }));
    });
    return book;
  }

  /* ------------------------------------------------------------- geometry */
  function trimOf(design) {
    var t = TRIM_SIZES.filter(function (x) { return x.id === design.trim; })[0];
    if (!t) t = TRIM_SIZES[0];
    if (t.id === "custom") return { w: Number(design.customWidth) || 152.4, h: Number(design.customHeight) || 228.6, unit: "mm" };
    return { w: t.w, h: t.h, unit: t.unit };
  }

  function designTemplate(id) {
    return DESIGN_TEMPLATES.filter(function (t) { return t.id === id; })[0] || DESIGN_TEMPLATES[0];
  }

  /* ---------------------------------------------------------------- stats */
  function chapterWords(ch) { return U.countWords(U.stripHtml(ch.content || "")); }

  function stats(book) {
    if (!book) return { words: 0, chars: 0, chapters: 0, written: 0, readingMinutes: 0, progress: 0 };
    var words = 0, chars = 0, written = 0;
    (book.chapters || []).forEach(function (ch) {
      var text = U.stripHtml(ch.content || "");
      var w = U.countWords(text);
      words += w;
      chars += text.length;
      if (w > 0) written++;
    });
    (Object.keys(book.matter.front || {})).forEach(function (k) {
      var m = book.matter.front[k];
      if (m && m.enabled && m.content) { words += U.countWords(U.stripHtml(m.content)); chars += U.stripHtml(m.content).length; }
    });
    (Object.keys(book.matter.back || {})).forEach(function (k) {
      var m = book.matter.back[k];
      if (m && m.enabled && m.content) { words += U.countWords(U.stripHtml(m.content)); chars += U.stripHtml(m.content).length; }
    });
    return {
      words: words,
      chars: chars,
      chapters: (book.chapters || []).length,
      written: written,
      readingMinutes: U.readingMinutes(words),
      progress: book.targetWords ? Math.min(1, words / book.targetWords) : 0
    };
  }

  /* -------------------------------------------------------------- headings */
  function headingsFromHtml(html) {
    var out = [];
    if (!html) return out;
    var tpl = document.createElement("template");
    tpl.innerHTML = html;
    var nodes = tpl.content.querySelectorAll("h1,h2,h3,h4");
    Array.prototype.forEach.call(nodes, function (n) {
      out.push({ level: Number(n.tagName.slice(1)), text: (n.textContent || "").trim() });
    });
    return out;
  }

  function buildToc(book) {
    var entries = [];
    FRONT_MATTER.forEach(function (m) {
      var st = book.matter.front[m.id];
      if (st && st.enabled && (st.content || m.id === "titlePage" || m.id === "copyright" || m.id === "toc")) {
        entries.push({ label: m.name, kind: "front", key: m.id, level: 1, chapterId: null });
      }
    });
    var byPart = U.groupBy(book.chapters || [], function (c) { return c.partId || ""; });
    (book.parts || []).forEach(function (p) {
      entries.push({ label: p.title, kind: "part", key: p.id, level: 1, chapterId: null });
      (byPart[p.id] || []).forEach(function (ch) { pushChapter(entries, ch, 2); });
    });
    (byPart[""] || []).forEach(function (ch) { pushChapter(entries, ch, 1); });
    BACK_MATTER.forEach(function (m) {
      var st = book.matter.back[m.id];
      if (st && st.enabled && (st.content || m.id === "bibliography" || m.id === "references")) {
        entries.push({ label: m.name, kind: "back", key: m.id, level: 1, chapterId: null });
      }
    });
    return entries;
  }

  function pushChapter(entries, ch, level) {
    entries.push({ label: ch.title, kind: "chapter", key: ch.id, level: level, chapterId: ch.id });
    headingsFromHtml(ch.content).filter(function (h) { return h.level <= 3; }).forEach(function (h) {
      entries.push({ label: h.text, kind: "heading", key: ch.id, level: level + h.level, chapterId: ch.id, heading: h.text });
    });
  }

  /* ------------------------------------------------------------ citations */
  function authorString(source) {
    return (source && source.authors ? String(source.authors).trim() : "") || "";
  }

  function clean(text) {
    return String(text == null ? "" : text).replace(/\s+/g, " ").trim();
  }

  function ensurePeriod(s) {
    s = clean(s);
    if (!s) return "";
    return /[.!?]$/.test(s) ? s : s + ".";
  }

  function formatCitation(source, style, index) {
    var a = authorString(source);
    var title = clean(source.title || "");
    var year = clean(source.year || "");
    var publisher = clean(source.publisher || "");
    var doi = clean(source.doi || "");
    var url = clean(source.url || "");
    var pages = clean(source.pages || "");
    var accessed = clean(source.accessed || "");
    var parts = [];

    if (style === "apa") {
      if (a) parts.push(ensurePeriod(a));
      var yt = year ? "(" + year + ")." : "";
      if (yt) parts.push(yt);
      if (title) parts.push(ensurePeriod(source.type === "Book" || !source.type ? title : title));
      if (publisher) parts.push(ensurePeriod(publisher));
      if (pages) parts.push("pp. " + pages + ".");
      if (doi) parts.push("https://doi.org/" + doi.replace(/^https?:\/\/doi\.org\//, ""));
      else if (url) parts.push(url);
    } else if (style === "mla") {
      if (a) parts.push(ensurePeriod(a));
      if (title) parts.push(ensurePeriod('"' + title + '"'));
      if (publisher) parts.push(publisher + (year ? ", " + year : "") + ".");
      else if (year) parts.push(year + ".");
      if (pages) parts.push("pp. " + pages + ".");
      if (doi) parts.push("doi:" + doi.replace(/^https?:\/\/doi\.org\//, "") + ".");
      else if (url) parts.push("Web. " + (accessed ? accessed + ". " : "") + url + ".");
    } else if (style === "chicago") {
      if (a) parts.push(ensurePeriod(a));
      if (title) parts.push(ensurePeriod('"' + title + '"'));
      if (publisher) parts.push(publisher + (year ? ", " + year : "") + ".");
      else if (year) parts.push(year + ".");
      if (pages) parts.push(pages + ".");
      if (doi) parts.push("https://doi.org/" + doi.replace(/^https?:\/\/doi\.org\//, "") + ".");
      else if (url) parts.push(url + ".");
    } else { /* ieee */
      var n = index == null ? "" : "[" + index + "] ";
      var head = n + (a ? a + ", " : "");
      if (title) head += '"' + title + '," ';
      if (publisher) head += publisher + ", ";
      if (year) head += year + ".";
      parts.push(head.replace(/,\s*$/, "."));
      if (pages) parts.push("pp. " + pages + ".");
      if (doi) parts.push("doi: " + doi.replace(/^https?:\/\/doi\.org\//, "") + ".");
      else if (url) parts.push("Available: " + url + ".");
    }
    return clean(parts.join(" ")).replace(/\s+([.,])/g, "$1").replace(/\.\./g, ".").replace(/\s+\./g, ".");
  }

  function formatInText(source, style, index, locator) {
    var a = authorString(source);
    var surname = a ? a.split(/[,;]/)[0].trim().split(/\s+/).slice(-1)[0] : "";
    var year = clean(source.year || "");
    var loc = locator ? clean(locator) : "";
    if (style === "mla") return "(" + (surname || "Unknown") + (loc ? " " + loc : "") + ")";
    if (style === "ieee") return "[" + (index || "?") + "]";
    if (style === "chicago") return "(" + (surname || "Unknown") + (year ? " " + year : "") + (loc ? ", " + loc : "") + ")";
    return "(" + (surname || "Unknown") + (year ? ", " + year : "") + (loc ? ", p. " + loc : "") + ")";
  }

  function bibliography(book, style) {
    var sources = (book.sources || []).slice();
    return sources.map(function (s, i) {
      return { source: s, text: formatCitation(s, style || "apa", i + 1) };
    });
  }

  function citedIds(book) {
    var ids = {};
    (book.chapters || []).forEach(function (ch) {
      var m = String(ch.content || "").match(/data-source-id="([^"]+)"/g);
      if (m) m.forEach(function (x) { ids[x.replace(/.*data-source-id="|"/g, "")] = true; });
    });
    return Object.keys(ids);
  }

  /* -------------------------------------------------------------- module */
  BF.model = {
    TEMPLATES: TEMPLATES, TRIM_SIZES: TRIM_SIZES, DESIGN_TEMPLATES: DESIGN_TEMPLATES,
    CITATION_STYLES: CITATION_STYLES, SOURCE_TYPES: SOURCE_TYPES,
    FRONT_MATTER: FRONT_MATTER, BACK_MATTER: BACK_MATTER, NOTE_TYPES: NOTE_TYPES,
    MANUSCRIPT_FORMATS: MANUSCRIPT_FORMATS, CATEGORIES: CATEGORIES, LANGUAGES: LANGUAGES,
    createBook: createBook, createChapter: createChapter, defaultDesign: defaultDesign,
    defaultMatter: defaultMatter, trimOf: trimOf, designTemplate: designTemplate,
    chapterWords: chapterWords, stats: stats,
    headingsFromHtml: headingsFromHtml, buildToc: buildToc,
    formatCitation: formatCitation, formatInText: formatInText, bibliography: bibliography,
    citedIds: citedIds
  };
})();

</script>
<script data-src="js/storage.js">
/* BookForge Studio — persistence layer.
   Primary: IndexedDB. Fallback: localStorage (declared honestly in the UI).
   Save status is only reported as "saved" after the write has actually completed. */
(function () {
  "use strict";
  var BF = (window.BF = window.BF || {});
  var U = BF.util;

  var DB_NAME = "bookforge-studio";
  var DB_VERSION = 1;
  var STORES = { projects: "projects", versions: "versions", meta: "meta" };
  var LS_KEY = "bookforge-studio-fallback";

  var state = {
    mode: "indexeddb",       // 'indexeddb' | 'localstorage' | 'memory'
    db: null,
    lastError: null,
    writeChain: Promise.resolve()
  };

  function notify(status, error) {
    if (typeof state.onStatus === "function") {
      try { state.onStatus(status, error || null); } catch (e) { /* listener errors must not break saving */ }
    }
  }

  /* ------------------------------------------------------------ indexedDB */
  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req;
      try {
        req = indexedDB.open(DB_NAME, DB_VERSION);
      } catch (e) { reject(e); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORES.projects)) db.createObjectStore(STORES.projects, { keyPath: "id" });
        if (!db.objectStoreNames.contains(STORES.versions)) {
          var v = db.createObjectStore(STORES.versions, { keyPath: "id" });
          v.createIndex("bookId", "bookId", { unique: false });
        }
        if (!db.objectStoreNames.contains(STORES.meta)) db.createObjectStore(STORES.meta, { keyPath: "key" });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error("IndexedDB open failed")); };
      req.onblocked = function () { reject(new Error("IndexedDB is blocked by another tab.")); };
    });
  }

  function idbTx(db, store, mode, fn) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(store, mode);
      var os = tx.objectStore(store);
      var out;
      try { out = fn(os); } catch (e) { reject(e); return; }
      tx.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
      tx.onerror = function () { reject(tx.error || new Error("IndexedDB transaction failed")); };
      tx.onabort = function () { reject(tx.error || new Error("IndexedDB transaction aborted")); };
    });
  }

  function idbGetAll(db, store) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(store, "readonly");
      var req = tx.objectStore(store).getAll();
      req.onsuccess = function () { resolve(req.result || []); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbGet(db, store, key) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(store, "readonly");
      var req = tx.objectStore(store).get(key);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function () { reject(req.error); };
    });
  }

  /* --------------------------------------------------------- localstorage */
  function lsRead() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : { projects: [], versions: [], meta: {} };
    } catch (e) { return { projects: [], versions: [], meta: {} }; }
  }
  function lsWrite(data) {
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  }

  /* ----------------------------------------------------------------- init */
  async function init() {
    try {
      state.db = await idbOpen();
      state.mode = "indexeddb";
    } catch (e) {
      state.lastError = e;
      state.mode = "localstorage";
      try {
        localStorage.setItem("bookforge-probe", "1");
        localStorage.removeItem("bookforge-probe");
      } catch (e2) {
        state.mode = "memory";
        state.memory = { projects: [], versions: [], meta: {} };
        state.lastError = e2;
      }
    }
    return state.mode;
  }

  /* ---------------------------------------------------------------- books */
  async function loadAllBooks() {
    if (state.mode === "indexeddb") return idbGetAll(state.db, STORES.projects);
    if (state.mode === "localstorage") return lsRead().projects;
    return state.memory.projects.slice();
  }

  async function saveBook(book) {
    if (!book || !book.id) throw new Error("saveBook: book.id is required");
    book.updatedAt = Date.now();
    var payload = U.clone(book);
    state.writeChain = state.writeChain.then(function () { return doWriteBook(payload); }, function () { return doWriteBook(payload); });
    notify("saving");
    try {
      await state.writeChain;
      notify("saved");
      return true;
    } catch (e) {
      state.lastError = e;
      notify("error", e);
      throw e;
    }
  }

  async function doWriteBook(payload) {
    if (state.mode === "indexeddb") return idbTx(state.db, STORES.projects, "readwrite", function (os) { return os.put(payload); });
    if (state.mode === "localstorage") {
      var data = lsRead();
      var idx = data.projects.findIndex(function (b) { return b.id === payload.id; });
      if (idx >= 0) data.projects[idx] = payload; else data.projects.push(payload);
      lsWrite(data);
      return true;
    }
    var i = state.memory.projects.findIndex(function (b) { return b.id === payload.id; });
    if (i >= 0) state.memory.projects[i] = payload; else state.memory.projects.push(payload);
    return true;
  }

  async function deleteBook(id) {
    if (state.mode === "indexeddb") return idbTx(state.db, STORES.projects, "readwrite", function (os) { return os.delete(id); });
    if (state.mode === "localstorage") {
      var data = lsRead();
      data.projects = data.projects.filter(function (b) { return b.id !== id; });
      data.versions = data.versions.filter(function (v) { return v.bookId !== id; });
      lsWrite(data);
      return true;
    }
    state.memory.projects = state.memory.projects.filter(function (b) { return b.id !== id; });
    state.memory.versions = state.memory.versions.filter(function (v) { return v.bookId !== id; });
    return true;
  }

  /* -------------------------------------------------------------- versions */
  async function listVersions(bookId) {
    var all;
    if (state.mode === "indexeddb") all = await idbGetAll(state.db, STORES.versions);
    else if (state.mode === "localstorage") all = lsRead().versions;
    else all = state.memory.versions.slice();
    return all.filter(function (v) { return v.bookId === bookId; })
      .sort(function (a, b) { return b.createdAt - a.createdAt; });
  }

  async function getVersion(id) {
    if (state.mode === "indexeddb") return idbGet(state.db, STORES.versions, id);
    var all = state.mode === "localstorage" ? lsRead().versions : state.memory.versions;
    return all.filter(function (v) { return v.id === id; })[0] || null;
  }

  async function addVersion(book, opts) {
    opts = opts || {};
    var entry = {
      id: U.uid("ver"),
      bookId: book.id,
      name: opts.name || (opts.auto ? "Automatic snapshot" : "Named version"),
      auto: !!opts.auto,
      note: opts.note || "",
      createdAt: Date.now(),
      words: BF.model.stats(book).words,
      data: U.clone(book)
    };
    if (state.mode === "indexeddb") await idbTx(state.db, STORES.versions, "readwrite", function (os) { return os.put(entry); });
    else if (state.mode === "localstorage") {
      var data = lsRead();
      data.versions.push(entry);
      while (data.versions.filter(function (v) { return v.bookId === book.id; }).length > 40) {
        var list = data.versions.filter(function (v) { return v.bookId === book.id; }).sort(function (a, b) { return a.createdAt - b.createdAt; });
        var oldest = list[0];
        data.versions = data.versions.filter(function (v) { return v.id !== oldest.id; });
      }
      try { lsWrite(data); } catch (e) { /* quota: keep newest only */ }
    } else {
      state.memory.versions.push(entry);
    }
    return entry;
  }

  async function deleteVersion(id) {
    if (state.mode === "indexeddb") return idbTx(state.db, STORES.versions, "readwrite", function (os) { return os.delete(id); });
    if (state.mode === "localstorage") {
      var data = lsRead();
      data.versions = data.versions.filter(function (v) { return v.id !== id; });
      lsWrite(data);
      return true;
    }
    state.memory.versions = state.memory.versions.filter(function (v) { return v.id !== id; });
    return true;
  }

  async function pruneVersions(bookId, keepAuto) {
    var list = await listVersions(bookId);
    var autos = list.filter(function (v) { return v.auto; });
    if (autos.length <= (keepAuto || 25)) return;
    var remove = autos.sort(function (a, b) { return a.createdAt - b.createdAt; }).slice(0, autos.length - (keepAuto || 25));
    for (var i = 0; i < remove.length; i++) await deleteVersion(remove[i].id);
  }

  /* ------------------------------------------------------------------ meta */
  async function loadMeta() {
    if (state.mode === "indexeddb") {
      var rows = await idbGetAll(state.db, STORES.meta);
      var out = {};
      rows.forEach(function (r) { out[r.key] = r.value; });
      return out;
    }
    if (state.mode === "localstorage") return lsRead().meta || {};
    return state.memory.meta || {};
  }

  async function saveMeta(patch) {
    if (state.mode === "indexeddb") {
      var keys = Object.keys(patch);
      for (var i = 0; i < keys.length; i++) {
        await idbTx(state.db, STORES.meta, "readwrite", (function (k) {
          return function (os) { return os.put({ key: k, value: patch[k] }); };
        })(keys[i]));
      }
      return true;
    }
    if (state.mode === "localstorage") {
      var data = lsRead();
      data.meta = Object.assign({}, data.meta || {}, patch);
      lsWrite(data);
      return true;
    }
    state.memory.meta = Object.assign({}, state.memory.meta || {}, patch);
    return true;
  }

  /* ------------------------------------------------------- import / export */
  function exportProject(book) {
    return {
      application: "BookForge Studio",
      format: "bookforge-project",
      version: 1,
      exportedAt: new Date().toISOString(),
      book: U.clone(book)
    };
  }

  function normaliseBook(raw) {
    var warnings = [];
    if (!raw || typeof raw !== "object") throw new Error("The backup does not contain a book object.");
    var book = U.clone(raw);
    if (!book.id) { book.id = U.uid("book"); warnings.push("Book had no id; a new one was generated."); }
    book.title = book.title || "Imported book";
    book.author = book.author || "";
    book.chapters = Array.isArray(book.chapters) ? book.chapters : [];
    book.parts = Array.isArray(book.parts) ? book.parts : [];
    book.notes = Array.isArray(book.notes) ? book.notes : [];
    book.sources = Array.isArray(book.sources) ? book.sources : [];
    book.assets = Array.isArray(book.assets) ? book.assets : [];
    book.comments = Array.isArray(book.comments) ? book.comments : [];
    book.trashChapters = Array.isArray(book.trashChapters) ? book.trashChapters : [];
    book.chapters.forEach(function (ch, i) {
      if (!ch.id) ch.id = U.uid("ch");
      ch.title = ch.title || "Chapter " + (i + 1);
      ch.content = typeof ch.content === "string" ? ch.content : "";
      if (ch.order == null) ch.order = i + 1;
    });
    if (!book.matter || !book.matter.front || !book.matter.back) book.matter = BF.model.defaultMatter();
    BF.model.FRONT_MATTER.concat(BF.model.BACK_MATTER).forEach(function (m) {
      ["front", "back"].forEach(function (side) {
        if (!book.matter[side][m.id]) book.matter[side][m.id] = { enabled: false, content: "" };
      });
    });
    if (!book.design) book.design = BF.model.defaultDesign("minimal-academic");
    if (!book.settings) book.settings = { theme: "dark", citationStyle: "apa" };
    if (!book.goals) book.goals = { dailyTarget: 500, deadline: "" };
    book.updatedAt = Date.now();
    return { book: book, warnings: warnings };
  }

  function parseProjectBackup(text) {
    var parsed;
    try { parsed = JSON.parse(text); } catch (e) { throw new Error("The selected file is not valid JSON."); }
    var raw = parsed && parsed.book ? parsed.book : parsed;
    if (!raw || typeof raw !== "object" || !raw.chapters) {
      throw new Error("This file is not a BookForge project backup (no manuscript found).");
    }
    return normaliseBook(raw);
  }

  BF.storage = {
    init: init,
    get mode() { return state.mode; },
    get lastError() { return state.lastError; },
    loadAllBooks: loadAllBooks,
    saveBook: saveBook,
    deleteBook: deleteBook,
    listVersions: listVersions,
    getVersion: getVersion,
    addVersion: addVersion,
    deleteVersion: deleteVersion,
    pruneVersions: pruneVersions,
    loadMeta: loadMeta,
    saveMeta: saveMeta,
    exportProject: exportProject,
    parseProjectBackup: parseProjectBackup,
    normaliseBook: normaliseBook,
    set onStatus(fn) { state.onStatus = fn; }
  };
})();

</script>
<script data-src="js/editor.js">
/* BookForge Studio — manuscript editor built on a contenteditable surface.
   Structured HTML per chapter; Word/Chapter data is persisted by the app layer. */
(function () {
  "use strict";
  var BF = (window.BF = window.BF || {});
  var U = BF.util;

  function Editor(root, opts) {
    this.root = root;
    this.opts = opts || {};
    this.savedRange = null;
    this._bind();
  }

  Editor.prototype._bind = function () {
    var self = this;
    try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch (e) { /* older engines */ }

    this.root.addEventListener("input", function () { self._changed(); });
    this.root.addEventListener("blur", function () { self.saveSelection(); });
    this.root.addEventListener("keyup", function () { self._selectionChanged(); });
    this.root.addEventListener("mouseup", function () { self.saveSelection(); self._selectionChanged(); });
    this.root.addEventListener("keydown", function (e) { self._keydown(e); });
    this.root.addEventListener("paste", function (e) { self._paste(e); });
    this.root.addEventListener("drop", function (e) { self._drop(e); });
    this.root.addEventListener("dblclick", function (e) {
      var target = e.target;
      if (target && target.tagName === "IMG" && self.opts.onImageDblClick) {
        e.preventDefault();
        self.opts.onImageDblClick(target);
      }
    });
    document.addEventListener("selectionchange", function () {
      if (document.activeElement === self.root) { self._selectionChanged(); }
    });
  };

  Editor.prototype._changed = function () {
    if (this.opts.onChange) this.opts.onChange(this.getHtml());
    if (this.opts.onStats) {
      var text = this.root.textContent || "";
      this.opts.onStats({ words: U.countWords(text), chars: text.length });
    }
    if (this.opts.typewriter && this.opts.typewriter()) this.scrollCaretToLine();
  };

  Editor.prototype._selectionChanged = function () {
    if (this.opts.onSelectionState) {
      var state = {};
      ["bold", "italic", "underline", "strikeThrough", "insertUnorderedList", "insertOrderedList",
        "justifyLeft", "justifyCenter", "justifyRight", "justifyFull"].forEach(function (c) {
        try { state[c] = document.queryCommandState(c); } catch (e) { state[c] = false; }
      });
      state.block = this.currentBlockTag();
      this.opts.onSelectionState(state);
    }
  };

  Editor.prototype._keydown = function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && !e.shiftKey && !e.altKey) {
      var k = e.key.toLowerCase();
      if (k === "b") { e.preventDefault(); this.exec("bold"); return; }
      if (k === "i") { e.preventDefault(); this.exec("italic"); return; }
      if (k === "u") { e.preventDefault(); this.exec("underline"); return; }
      if (k === "s") { e.preventDefault(); if (this.opts.onSave) this.opts.onSave(); return; }
      if (k === "f") { e.preventDefault(); if (this.opts.onFind) this.opts.onFind(); return; }
    }
    if (mod && e.shiftKey) {
      if (e.key === "1") { e.preventDefault(); this.formatBlock("h1"); return; }
      if (e.key === "2") { e.preventDefault(); this.formatBlock("h2"); return; }
      if (e.key === "3") { e.preventDefault(); this.formatBlock("h3"); return; }
      if (e.key === "0") { e.preventDefault(); this.formatBlock("p"); return; }
      if (e.key === "7") { e.preventDefault(); this.exec("insertOrderedList"); return; }
      if (e.key === "8") { e.preventDefault(); this.exec("insertUnorderedList"); return; }
      if (e.key === "9") { e.preventDefault(); this.formatBlock("blockquote"); return; }
    }
    if (e.key === "Tab") {
      var inList = false;
      try { inList = document.queryCommandState("insertUnorderedList") || document.queryCommandState("insertOrderedList"); } catch (err) { inList = false; }
      if (inList) { e.preventDefault(); this.exec(e.shiftKey ? "outdent" : "indent"); }
    }
  };

  Editor.prototype._paste = function (e) {
    var cd = e.clipboardData;
    if (!cd) return;
    var html = cd.getData("text/html");
    var text = cd.getData("text/plain");
    e.preventDefault();
    if (html && !e.shiftKey) {
      this.insertHtml(U.sanitizeHtml(html));
    } else {
      var safe = U.escapeHtml(text || "").replace(/\r?\n\r?\n/g, "</p><p>").replace(/\r?\n/g, "<br>");
      this.insertHtml("<p>" + safe + "</p>");
    }
    this._changed();
  };

  Editor.prototype._drop = function (e) {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    var file = e.dataTransfer.files[0];
    if (/^image\//.test(file.type) && this.opts.onImageFile) this.opts.onImageFile(file);
  };

  /* ------------------------------------------------------------- commands */
  Editor.prototype.focus = function () { this.root.focus(); };

  Editor.prototype.exec = function (cmd, value) {
    this.focus();
    this.restoreSelection();
    try { document.execCommand(cmd, false, value == null ? null : value); } catch (e) { /* ignored */ }
    this._changed();
    this._selectionChanged();
  };

  Editor.prototype.formatBlock = function (tag) {
    this.focus();
    this.restoreSelection();
    try { document.execCommand("formatBlock", false, "<" + tag + ">"); } catch (e) { /* ignored */ }
    this._changed();
    this._selectionChanged();
  };

  Editor.prototype.setColor = function (color) { this.exec("foreColor", color); };
  Editor.prototype.highlight = function (color) { this.exec("hiliteColor", color); };

  Editor.prototype.currentBlockTag = function () {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return "P";
    var node = sel.getRangeAt(0).commonAncestorContainer;
    if (node.nodeType !== 1) node = node.parentElement;
    while (node && node !== this.root) {
      if (/^(H1|H2|H3|P|BLOCKQUOTE|DIV|LI)$/.test(node.tagName)) return node.tagName;
      node = node.parentElement;
    }
    return "P";
  };

  Editor.prototype.saveSelection = function () {
    var sel = window.getSelection();
    if (sel && sel.rangeCount && this.root.contains(sel.anchorNode)) {
      this.savedRange = sel.getRangeAt(0).cloneRange();
    }
  };

  Editor.prototype.restoreSelection = function () {
    if (!this.savedRange) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(this.savedRange);
  };

  Editor.prototype.insertHtml = function (html) {
    this.focus();
    this.restoreSelection();
    var ok = false;
    try { ok = document.execCommand("insertHTML", false, html); } catch (e) { ok = false; }
    if (!ok) {
      var sel = window.getSelection();
      if (sel && sel.rangeCount) {
        var range = sel.getRangeAt(0);
        range.deleteContents();
        var tpl = document.createElement("template");
        tpl.innerHTML = html;
        var frag = tpl.content;
        var last = frag.lastChild;
        range.insertNode(frag);
        if (last) {
          range.setStartAfter(last);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }
    }
    this.saveSelection();
    this._changed();
  };

  Editor.prototype.insertText = function (text) { this.insertHtml(U.escapeHtml(text)); };

  Editor.prototype.insertLink = function (href, label) {
    var sel = window.getSelection();
    var hasSelection = sel && sel.rangeCount && !sel.getRangeAt(0).collapsed;
    if (hasSelection) { this.exec("createLink", href); }
    else this.insertHtml('<a href="' + U.escapeHtml(href) + '">' + U.escapeHtml(label || href) + "</a>");
  };

  Editor.prototype.insertImage = function (src, alt) {
    var fig = '<figure contenteditable="false"><img src="' + U.escapeHtml(src) + '" alt="' + U.escapeHtml(alt || "") + '" title="Double-click to edit image size and compression"><figcaption contenteditable="true">' + U.escapeHtml(alt || "Figure caption") + "</figcaption></figure><p><br></p>";
    this.insertHtml(fig);
  };

  Editor.prototype.insertTable = function (rows, cols) {
    var r, c, html = "<table><thead><tr>";
    for (c = 0; c < cols; c++) html += "<th>Column " + (c + 1) + "</th>";
    html += "</tr></thead><tbody>";
    for (r = 1; r < rows; r++) {
      html += "<tr>";
      for (c = 0; c < cols; c++) html += "<td>&nbsp;</td>";
      html += "</tr>";
    }
    html += "</tbody></table><p><br></p>";
    this.insertHtml(html);
  };

  Editor.prototype.insertPageBreak = function () {
    this.insertHtml('<hr class="page-break" contenteditable="false"><p><br></p>');
  };

  Editor.prototype.insertSectionBreak = function () {
    this.insertHtml('<p class="section-break" contenteditable="false"></p><p><br></p>');
  };

  Editor.prototype.insertHorizontalRule = function () { this.exec("insertHorizontalRule"); };

  Editor.prototype.insertFootnote = function (note) {
    var existing = this.root.querySelectorAll("sup.fn").length;
    var n = existing + 1;
    this.insertHtml('<sup class="fn" contenteditable="false" data-note="' + U.escapeHtml(note) + '" title="' + U.escapeHtml(note) + '">' + n + "</sup>");
    this.ensureEndnoteBlock();
    var ol = this.root.querySelector(".endnote-block ol");
    if (ol) {
      var li = document.createElement("li");
      li.innerHTML = U.escapeHtml(note);
      ol.appendChild(li);
    }
  };

  Editor.prototype.ensureEndnoteBlock = function () {
    var block = this.root.querySelector(".endnote-block");
    if (!block) {
      block = document.createElement("div");
      block.className = "endnote-block";
      block.innerHTML = "<h3>Notes</h3><ol></ol>";
      this.root.appendChild(block);
    }
    return block;
  };

  Editor.prototype.insertCitation = function (text, sourceId, title) {
    this.insertHtml('<span class="citation" contenteditable="false" data-source-id="' + U.escapeHtml(sourceId || "") + '" title="' + U.escapeHtml(title || "") + '">' + U.escapeHtml(text) + "</span>");
  };

  Editor.prototype.insertCaption = function (text) {
    this.insertHtml('<p class="caption">' + U.escapeHtml(text) + "</p>");
  };

  /* ---------------------------------------------------------- find & replace */
  Editor.prototype.findNext = function (term, backwards) {
    if (!term) return false;
    this.focus();
    var found = false;
    try {
      found = window.find(term, false, !!backwards, true, false, false, false);
    } catch (e) { found = false; }
    return found;
  };

  Editor.prototype.replaceCurrent = function (term, replacement) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return false;
    var range = sel.getRangeAt(0);
    if (range.collapsed) return false;
    var selected = sel.toString();
    if (term && selected.toLowerCase() !== term.toLowerCase()) return false;
    range.deleteContents();
    var node = document.createTextNode(replacement);
    range.insertNode(node);
    sel.removeAllRanges();
    var after = document.createRange();
    after.setStartAfter(node);
    after.collapse(true);
    sel.addRange(after);
    this._changed();
    return true;
  };

  Editor.prototype.replaceAll = function (term, replacement) {
    if (!term) return 0;
    var count = 0;
    var walker = document.createTreeWalker(this.root, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    var n;
    while ((n = walker.nextNode())) { if (n.nodeValue && n.nodeValue.indexOf(term) >= 0) nodes.push(n); }
    nodes.forEach(function (node) {
      var parts = node.nodeValue.split(term);
      count += parts.length - 1;
      var parent = node.parentNode;
      if (!parent) return;
      var frag = document.createDocumentFragment();
      parts.forEach(function (p, i) {
        if (i > 0) frag.appendChild(document.createTextNode(replacement));
        frag.appendChild(document.createTextNode(p));
      });
      parent.replaceChild(frag, node);
    });
    if (count) this._changed();
    return count;
  };

  /* ------------------------------------------------------------ typewriter */
  Editor.prototype.scrollCaretToLine = function () {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var range = sel.getRangeAt(0).cloneRange();
    range.collapse(true);
    var rect = range.getClientRects()[0];
    if (!rect) return;
    var host = this.opts.scroller ? this.opts.scroller() : null;
    if (!host) return;
    var hostRect = host.getBoundingClientRect();
    var target = hostRect.top + hostRect.height * 0.42;
    var delta = rect.top - target;
    if (Math.abs(delta) > 8) host.scrollTop += delta;
  };

  /* -------------------------------------------------------------- content */
  Editor.prototype.getHtml = function () { return this.root.innerHTML; };
  Editor.prototype.getText = function () { return this.root.textContent || ""; };
  Editor.prototype.setHtml = function (html) {
    this.root.innerHTML = html || "";
    this.savedRange = null;
    this._changed();
  };
  Editor.prototype.getStats = function () {
    var text = this.root.textContent || "";
    return { words: U.countWords(text), chars: text.length };
  };

  BF.Editor = Editor;
})();

<script data-src="js/layout.js">
/* BookForge Studio — print layout: measurement-based pagination.
   Blocks are measured in the real page geometry and flowed into pages. Oversized
   paragraphs are split at word level; tables and figures move whole to the next page. */
(function () {
  "use strict";
  var BF = (window.BF = window.BF || {});
  var U = BF.util;

  var MM = 96 / 25.4;        // px per mm at CSS 96 dpi
  var PT = 96 / 72;          // px per pt

  function mm(px) { return px / MM; }
  function toPx(v) { return v * MM; }

  function romanish(n) {
    var map = [[1000, "m"], [900, "cm"], [500, "d"], [400, "cd"], [100, "c"], [90, "xc"],
      [50, "l"], [40, "xl"], [10, "x"], [9, "ix"], [5, "v"], [4, "iv"], [1, "i"]];
    var out = "";
    map.forEach(function (pair) { while (n >= pair[0]) { out += pair[1]; n -= pair[0]; } });
    return out || "i";
  }

  /* --------------------------------------------------------------- helpers */
  function elementFromHtml(html) {
    var tpl = document.createElement("template");
    tpl.innerHTML = html || "";
    return Array.prototype.slice.call(tpl.content.childNodes).map(function (n) {
      if (n.nodeType === 3) {
        var p = document.createElement("p");
        p.textContent = n.nodeValue;
        return p;
      }
      return n;
    });
  }

  function wordCountOf(el) {
    return U.countWords(el.textContent || "");
  }

  /* Truncate element text to the first n words, preserving inline structure. */
  function limitWords(el, n) {
    var w = 0;
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var node, remove = [];
    while ((node = walker.nextNode())) {
      var text = node.nodeValue || "";
      var tokens = text.split(/(\s+)/);
      var out = "";
      for (var i = 0; i < tokens.length; i++) {
        if (/^\s+$/.test(tokens[i])) { out += tokens[i]; continue; }
        if (w >= n) { if (!/^\s*$/.test(out)) remove.push({ node: node, cut: out }); else remove.push({ node: node, cut: "" }); break; }
        out += tokens[i];
        w++;
      }
      if (w >= n) {
        node.nodeValue = out;
        break;
      }
    }
    return el;
  }

  /* Remove the first n words from an element, preserving structure. */
  function skipWords(el, n) {
    var w = 0;
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var node;
    while ((node = walker.nextNode())) {
      var tokens = (node.nodeValue || "").split(/(\s+)/);
      var out = "";
      var started = false;
      for (var i = 0; i < tokens.length; i++) {
        if (/^\s+$/.test(tokens[i])) { if (started) out += tokens[i]; continue; }
        if (w < n) { w++; started = true; continue; }
        out += tokens[i];
      }
      node.nodeValue = out.replace(/^\s+/, "");
      if (w >= n) break;
    }
    el.normalize();
    return el;
  }

  function isLikelySplit(el) {
    return /^(P|BLOCKQUOTE|H1|H2|H3|H4)$/i.test(el.tagName);
  }

  function isAtomic(el) {
    return /^(TABLE|FIGURE|IMG|HR|UL|OL|PRE)$/i.test(el.tagName);
  }

  /* --------------------------------------------------------------- flow */
  function matterBlocks(key, state, book) {
    var label = null;
    BF.model.FRONT_MATTER.concat(BF.model.BACK_MATTER).forEach(function (m) { if (m.id === key) label = m.name; });
    var blocks = [];
    if (key === "titlePage") {
      blocks.push(elText("h1", book.title || "Untitled book", "matter-title"));
      if (book.subtitle) blocks.push(elText("p", book.subtitle, "matter-subtitle"));
      if (book.author) blocks.push(elText("p", book.author, "matter-author"));
      blocks.push(elText("p", book.publisher || "", "matter-publisher"));
    } else if (key === "halfTitle") {
      blocks.push(elText("h1", book.title || "Untitled book", "matter-halftitle"));
    } else if (key === "copyright") {
      var lines = state.content ? elementFromHtml(state.content) : elementFromHtml(
        "<p>" + U.escapeHtml(book.title || "Untitled book") + "</p>" +
        (book.author ? "<p>Copyright © " + U.escapeHtml(book.copyrightYear || "") + " " + U.escapeHtml(book.author) + "</p>" : "") +
        (book.publisher ? "<p>Published by " + U.escapeHtml(book.publisher) + (book.edition ? " · " + U.escapeHtml(book.edition) + " edition" : "") + "</p>" : "") +
        (book.isbn ? "<p>ISBN (as supplied by the author): " + U.escapeHtml(book.isbn) + "</p>" : "") +
        "<p>All rights reserved. This copyright page is a template and does not by itself establish or guarantee legal protection.</p>"
      );
      blocks = lines;
    } else if (key === "toc") {
      blocks.push(elText("h1", "Contents", "matter-heading"));
      BF.model.buildToc(book).forEach(function (e) {
        var cls = "toc-" + e.kind + " toc-level-" + Math.min(e.level, 3);
        blocks.push(elText("p", e.label, cls));
      });
    } else if (key === "listFigures" || key === "listTables") {
      var want = key === "listFigures" ? "FIGURE" : "TABLE";
      blocks.push(elText("h1", want === "FIGURE" ? "List of figures" : "List of tables", "matter-heading"));
      var any = false;
      (book.chapters || []).forEach(function (ch) {
        var tpl = document.createElement("template");
        tpl.innerHTML = ch.content || "";
        var nodes = tpl.content.querySelectorAll(want);
        Array.prototype.forEach.call(nodes, function (n) {
          var cap = n.querySelector ? n.querySelector("figcaption") : null;
          var text = (cap && cap.textContent) || (n.textContent || "").trim() || (want === "FIGURE" ? "Figure" : "Table");
          blocks.push(elText("p", text, "toc-entry"));
          any = true;
        });
      });

  function buildFlow(book) {
    var flow = [];
    var frontKeys = BF.model.FRONT_MATTER.map(function (m) { return m.id; });
    var backKeys = BF.model.BACK_MATTER.map(function (m) { return m.id; });

    frontKeys.forEach(function (k) {
      var st = book.matter.front[k];
      var auto = ["titlePage", "copyright", "toc"].indexOf(k) >= 0;
      if (!st || (!st.enabled && !auto)) return;

      flow.push({
        role: "front", key: k, title: labelOf(k, "front"), blocks: matterBlocks(k, st, book),

    (book.parts || []).forEach(function (part) {
      var chapters = (book.chapters || []).filter(function (c) { return c.partId === part.id; });
      if (!chapters.length) return;
      flow.push({
        role: "part", key: part.id, title: part.title, newPage: true, chapterOpen: true,
        blocks: [elText("h1", part.title, "part-title")]

      chapters.forEach(function (ch) { flow.push(chapterFlow(ch, book)); });
    });
    (book.chapters || []).filter(function (c) { return !c.partId; }).forEach(function (ch) {
      flow.push(chapterFlow(ch, book));
    });

    backKeys.forEach(function (k) {
      var st = book.matter.back[k];
      var auto = ["bibliography", "references"].indexOf(k) >= 0;
      if (!st || (!st.enabled && !auto)) return;
      flow.push({
        role: "back", key: k, title: labelOf(k, "back"), blocks: backBlocks(k, st, book),
        newPage: true, chapterOpen: true

    });
    return flow;
  }

  function labelOf(key, side) {

    return m ? m.name : key;

  function chapterFlow(ch, book) {
    var blocks = [];

  function backBlocks(key, st, book) {
    var blocks = [elText("h1", labelOf(key, "back"), "matter-heading")];

    return blocks;
  }

  function measureHost(book) {

  function blockHeight(host, block) {
    host.innerHTML = "";

    var marginBottom = parseFloat(style.marginBottom) || 0;

  function paginate(book) {
    injectPaginationCss();
    var m = measureHost(book);
    var host = m.host;
    var geo = m.geo;
    var contentHpx = toPx(geo.contentH);
    var d = book.design || {};
    var flow = buildFlow(book);
    var warnings = [];
    var pages = [];

    var current = newPage(pages.length + 1, null);
    pages.push(current);
    var used = 0;

    function currentPage() { return pages[pages.length - 1]; }
    function pushPage(flowItem) {
      var p = newPage(pages.length + 1, flowItem);
      pages.push(p);
      used = 0;

        if (first && item.newPage) {
          if (pages.length > 1 || used > 0) pushPage(item);

          currentPage().title = item.title;
          currentPage().role = item.role;
          currentPage().chapterId = item.chapter ? item.chapter.id : null;
          first = false;
        }
        if (!currentPage().title && item.title) {
          currentPage().title = item.title;
          currentPage().role = item.role;
          if (!currentPage().chapterId) currentPage().chapterId = item.chapter ? item.chapter.id : null;
        }
        var clone = block.cloneNode(true);
        if (clone.nodeType !== 1) { clone = elText("p", clone.textContent || ""); }
        var h = blockHeight(host, clone);
        var remaining = contentHpx - used;

        if (h <= remaining) {
          currentPage().blocks.push(clone);
          used += h;
          return;
        }

        // Does not fit. Try splitting text-like blocks.
        if (isLikelySplit(clone) && !isAtomic(clone)) {
          var totalWords = wordCountOf(clone);
          if (totalWords > 4) {
            var lo = 1, hi = totalWords, best = 0;
            while (lo <= hi) {
              var mid = (lo + hi) >> 1;
              var trial = clone.cloneNode(true);
              limitWords(trial, mid);
              var th = blockHeight(host, trial);
              if (th <= Math.max(remaining, 0)) { best = mid; lo = mid + 1; }
              else hi = mid - 1;
            }
            if (best >= 3) {
              var part1 = clone.cloneNode(true);
              limitWords(part1, best);
              currentPage().blocks.push(part1);
              used += blockHeight(host, part1);

              var rest = clone.cloneNode(true);
              skipWords(rest, best);
              // Continue flowing the remainder on a fresh page.
              var carry = rest;
              while (wordCountOf(carry) > 0) {
                pushPage(item);
                var ch = blockHeight(host, carry);
                if (ch <= contentHpx) { currentPage().blocks.push(carry); used += ch; break; }
                var tw = wordCountOf(carry);
                var l2 = 1, h2 = tw, b2 = 0;
                while (l2 <= h2) {
                  var m2 = (l2 + h2) >> 1;
                  var t2 = carry.cloneNode(true);
                  limitWords(t2, m2);
                  if (blockHeight(host, t2) <= contentHpx) { b2 = m2; l2 = m2 + 1; } else h2 = m2 - 1;
                }
                if (b2 < 1) { warnings.push("A block could not be split to fit the page size."); currentPage().blocks.push(carry); used = contentHpx; break; }
                var p2 = carry.cloneNode(true);
                limitWords(p2, b2);
                currentPage().blocks.push(p2);
                used += blockHeight(host, p2);
                var r2 = carry.cloneNode(true);
                skipWords(r2, b2);
                carry = r2;
              }
              return;
            }
          }
        }

        // Atomic block: move to the next page.
        if (used > 0) {
          pushPage(item);
          currentPage().title = currentPage().title || item.title;
          currentPage().role = currentPage().role || item.role;
          var rem2 = contentHpx - used;
          var h2b = blockHeight(host, clone);
          if (h2b > contentHpx) {
            if (clone.tagName === "IMG") warnings.push("An image is taller than the printable area and may be clipped.");

          currentPage().blocks.push(clone);
          used += h2b;
          return;
        }
        currentPage().blocks.push(clone);
        used += h;
        if (h > contentHpx && !isAtomic(clone)) warnings.push("A long heading could not fit the printable area.");
      });
      // chapter opening: keep at least two lines with the heading (basic widow control)
    });

    /* Strip empty trailing page */
    if (pages.length > 1 && pages[pages.length - 1].blocks.length === 0) pages.pop();

    /* number the pages */
    var frontCount = 0;
    var arabic = 0;
    var arabicStarted = false;
    pages.forEach(function (p) {

  }

  function measureImage(src) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var maxW = 460;
        var w = img.naturalWidth || 400;
        var h = img.naturalHeight || 300;
        if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
        resolve({ width: w, height: h });
      };
      img.onerror = function () { resolve({ width: 320, height: 220 }); };
      img.src = src;
    });
  }

      var parent = b.parentNode;
      if (!parent) return;
      var h = document.createElement("h3");
      h.textContent = "Notes";
      parent.insertBefore(h, b);
    });
    var frag = tpl.content;
    var out = "";
    Array.prototype.forEach.call(frag.childNodes, function (n) {
      out += new XMLSerializer().serializeToString(n);
    });
    return out || "<p></p>";
  }

      "<head><meta charset=\"utf-8\"/><title>" + U.escapeXml(title) + "</title>" +

  async function buildEpub(book, opts) {
    opts = opts || {};
    var id = "urn:uuid:" + (window.crypto && crypto.randomUUID ? crypto.randomUUID() :
      "00000000-0000-4000-8000-" + String(Date.now()).slice(-12).padStart(12, "0"));
    var now = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
    var manifest = [], spine = [], navItems = [], entries = [];
    var imageMap = {};
    var imgCount = 0;

    function handleImages(html) {
      var tpl = document.createElement("template");
      tpl.innerHTML = U.sanitizeHtml(html || "");
      Array.prototype.forEach.call(tpl.content.querySelectorAll("img"), function (img) {
        var src = img.getAttribute("src") || "";
        if (src.indexOf("data:") !== 0) return;
        if (!imageMap[src]) {
          var parsed = U.dataUrlToBytes(src);
          imgCount++;
          var name = "image-" + imgCount + "." + parsed.ext;
          imageMap[src] = name;
          entries.push({ name: "OEBPS/images/" + name, data: parsed.bytes });
          manifest.push('<item id="img' + imgCount + '" href="images/' + name + '" media-type="' + parsed.mime + '"/>');
        }
        img.setAttribute("src", "../images/" + imageMap[src]);
      });
      var out = "";
      Array.prototype.forEach.call(tpl.content.childNodes, function (n) {
        out += new XMLSerializer().serializeToString(n);
      });
      return out || "<p></p>";
    }

    var used = {};
    function addDoc(name, title, html, navLevel) {
      var file = name + ".xhtml";
      var body = handleImages(html);
      entries.push({ name: "OEBPS/text/" + file, data: xhtmlPage(title, body, "../styles/style.css") });
      var docId = "doc-" + name;
      manifest.push('<item id="' + docId + '" href="text/' + file + '" media-type="application/xhtml+xml"/>');
      spine.push('<itemref idref="' + docId + '"/>');
      navItems.push({ href: "text/" + file, title: title, level: navLevel });
      return docId;
    }

    addDoc("title", "Title page", docTitlePage(book), 1);

    matterSections(book).forEach(function (m, i) {
      if (m.id === "titlePage") return;
      if (m.id === "toc" || m.id === "listFigures" || m.id === "listTables") return;
      addDoc("front-" + m.id, m.name, '<h1>' + U.escapeHtml(m.name) + "</h1>" + (m.content || ""), 1);
    });

    var n = 0;
    (book.parts || []).forEach(function (part) {
      var chapters = (book.chapters || []).filter(function (c) { return c.partId === part.id; });
      if (!chapters.length) return;
      addDoc("part-" + (++n), part.title, '<h1 class="part-title">' + U.escapeHtml(part.title) + "</h1>", 1);
      chapters.forEach(function (ch, i) {
        addDoc("ch-" + ch.id, ch.title, '<h1>' + U.escapeHtml(ch.title) + "</h1>" + (ch.content || ""), 2);
      });
    });
    (book.chapters || []).filter(function (c) { return !c.partId; }).forEach(function (ch) {
      addDoc("ch-" + ch.id, ch.title, '<h1>' + U.escapeHtml(ch.title) + "</h1>" + (ch.content || ""), 1);
    });

    backSections(book).forEach(function (m) {
      var extra = "";
      if (m.id === "bibliography" || m.id === "references") {
        var params = BF.model.bibliography(book, book.settings.citationStyle || "apa");
        extra = params.length
          ? "<ol>" + params.map(function (p) { return "<li>" + U.escapeHtml(p.text) + "</li>"; }).join("") + "</ol>"
          : "<p><em>No sources have been entered yet.</em></p>";
        m.content = extra;
      } else if (m.id === "index") {
        var terms = {};
        (book.chapters || []).forEach(function (ch) {
          BF.model.headingsFromHtml(ch.content).forEach(function (h) { if (h.text) terms[h.text] = (terms[h.text] || 0) + 1; });
        });
        var keys = Object.keys(terms).sort();
        extra = keys.length ? "<ul>" + keys.map(function (k) { return "<li>" + U.escapeHtml(k) + "</li>"; }).join("") + "</ul>" : "<p><em>No index terms found.</em></p>";
        m.content = extra;
      }
      addDoc("back-" + m.id, m.name, '<h1>' + U.escapeHtml(m.name) + "</h1>" + (m.content || ""), 1);
    });

    entries.push({ name: "OEBPS/styles/style.css", data: EPUB_CSS });
    manifest.push('<item id="css" href="styles/style.css" media-type="text/css"/>');
    manifest.push('<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>');

    var navHtml = '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n' +
      '<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="en" lang="en">' +
      '<head><meta charset="utf-8"/><title>Contents</title><link rel="stylesheet" type="text/css" href="styles/style.css"/></head><body>' +
      '<nav epub:type="toc" id="toc"><h1>Contents</h1><ol>' +
      navItems.map(function (it) { return '<li><a href="' + it.href + '">' + U.escapeXml(it.title) + "</a></li>"; }).join("") +
      "</ol></nav></body></html>";
    entries.push({ name: "OEBPS/nav.xhtml", data: navHtml });

    var opf = '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid" xml:lang="en">' +
      '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">' +
      '<dc:identifier id="bookid">' + U.escapeXml(id) + "</dc:identifier>" +
      "<dc:title>" + U.escapeXml(book.title || "Untitled book") + "</dc:title>" +
      (book.subtitle ? "<dc:title id=\"subtitle\">" + U.escapeXml(book.subtitle) + "</dc:title>" : "") +
      "<dc:language>" + U.escapeXml((book.language || "English").slice(0, 2).toLowerCase() === "en" ? "en" : langCode(book.language)) + "</dc:language>" +
      (book.author ? "<dc:creator>" + U.escapeXml(book.author) + "</dc:creator>" : "<dc:creator>Unknown author</dc:creator>") +
      (book.coAuthors ? "<dc:contributor>" + U.escapeXml(book.coAuthors) + "</dc:contributor>" : "") +
      (book.publisher ? "<dc:publisher>" + U.escapeXml(book.publisher) + "</dc:publisher>" : "") +
      (book.category ? "<dc:subject>" + U.escapeXml(book.category) + "</dc:subject>" : "") +
      "<dc:date>" + now + "</dc:date>" +
      '<meta property="dcterms:modified">' + now + "</meta>" +
      "</metadata><manifest>" + manifest.join("") + "</manifest><spine>" + spine.join("") + "</spine></package>";
    entries.push({ name: "OEBPS/content.opf", data: opf });

    entries.push({
      name: "META-INF/container.xml",
      data: '<?xml version="1.0" encoding="UTF-8"?>\n<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>'
    });

    /* mimetype must be first and stored uncompressed */
    entries.unshift({ name: "mimetype", data: "application/epub+zip" });

    if (opts.onProgress) opts.onProgress("Packaging EPUB", 92);
    return BF.zip.create(entries, { mime: "application/epub+zip" });
  }
