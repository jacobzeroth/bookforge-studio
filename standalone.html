    ".book-foot { margin-top: 4rem; border-top: 1px solid #e2d9c5; padding-top: 1rem; font-size: .85rem; color: #666; text-align: center; }",
    "@media print { body { max-width: none; padding: 0; font-size: 11pt; } .toc { border: 0; background: none; } section { break-before: page; } .book-head { break-after: page; } }",
    "@media (prefers-color-scheme: dark) { body { background: #14130f; color: #ece6d9; } .toc { background: #1b1915; border-color: #33302a; } .chapter-title, .matter-title { border-color: #33302a; } th { background: #23211b; } th, td { border-color: #3c382f; } .book-foot { border-color: #33302a; } .toc a { color: #d9c48f; } }"
  ].join("\n");

  /* ============================================================== Markdown */
  function inlineMd(node) {
    var out = "";
    Array.prototype.forEach.call(node.childNodes, function (n) {
      if (n.nodeType === 3) { out += U.escapeHtmlMd ? U.escapeHtmlMd(n.nodeValue) : n.nodeValue; return; }
      if (n.nodeType !== 1) return;
      var t = n.tagName;
      if (t === "B" || t === "STRONG") out += "**" + inlineMd(n) + "**";
      else if (t === "I" || t === "EM") out += "_" + inlineMd(n) + "_";
      else if (t === "U") out += "<u>" + inlineMd(n) + "</u>";
      else if (t === "S" || t === "STRIKE" || t === "DEL") out += "~~" + inlineMd(n) + "~~";
      else if (t === "SUP") out += "^" + inlineMd(n) + "^";
      else if (t === "SUB") out += "~" + inlineMd(n) + "~";
      else if (t === "A") out += "[" + inlineMd(n) + "](" + (n.getAttribute("href") || "") + ")";
      else if (t === "IMG") out += "![" + (n.getAttribute("alt") || "") + "](" + (n.getAttribute("src") || "") + ")";
      else if (t === "BR") out += "  \n";
      else out += inlineMd(n);
    });
    return out;
  }

  function htmlToMarkdown(html, depth) {
    depth = depth || 0;
    var tpl = document.createElement("template");
    tpl.innerHTML = U.sanitizeHtml(html || "");
    var out = [];
    Array.prototype.forEach.call(tpl.content.childNodes, function (node) {
      if (node.nodeType === 3) {
        if (node.nodeValue.trim()) out.push(node.nodeValue.trim());
        return;
      }
      if (node.nodeType !== 1) return;
      switch (node.tagName) {
        case "H1": out.push("# " + inlineMd(node)); break;
        case "H2": out.push("## " + inlineMd(node)); break;
        case "H3": out.push("### " + inlineMd(node)); break;
        case "H4": out.push("#### " + inlineMd(node)); break;
        case "P": out.push(inlineMd(node)); break;
        case "BLOCKQUOTE": out.push("> " + inlineMd(node).replace(/\n/g, "\n> ")); break;
        case "UL": out.push(Array.prototype.map.call(node.querySelectorAll(":scope > li"), function (li) {
          return "- " + inlineMd(li);
        }).join("\n")); break;
        case "OL": out.push(Array.prototype.map.call(node.querySelectorAll(":scope > li"), function (li, i) {
          return (i + 1) + ". " + inlineMd(li);
        }).join("\n")); break;
        case "HR": out.push("---"); break;
        case "FIGURE": {
          var img = node.querySelector("img");
          var cap = node.querySelector("figcaption");
          if (img) out.push("![" + (img.getAttribute("alt") || (cap ? cap.textContent : "")) + "](" + (img.getAttribute("src") || "") + ")");
          if (cap) out.push("*" + cap.textContent + "*");
          break;
        }
        case "IMG": out.push("![" + (node.getAttribute("alt") || "") + "](" + (node.getAttribute("src") || "") + ")"); break;
        case "TABLE": {
          var rows = node.querySelectorAll("tr");
          if (rows.length) {
            var md = [];
            Array.prototype.forEach.call(rows, function (tr, ri) {
              var cells = Array.prototype.map.call(tr.children, function (td) { return inlineMd(td).replace(/\|/g, "\\|"); });
              md.push("| " + cells.join(" | ") + " |");
              if (ri === 0) md.push("| " + cells.map(function () { return "---"; }).join(" | ") + " |");
            });
            out.push(md.join("\n"));
          }
          break;
        }
        case "DIV":
          if (node.classList.contains("endnote-block")) {
            out.push("**Notes**");
            Array.prototype.forEach.call(node.querySelectorAll("li"), function (li, i) { out.push((i + 1) + ". " + inlineMd(li)); });
          } else out.push(htmlToMarkdown(node.innerHTML, depth));
          break;
        default: out.push(inlineMd(node));
      }
    });
    return out.filter(function (s) { return s !== ""; }).join("\n\n");
  }

  function buildMarkdown(book) {
    var out = [];
    out.push("# " + (book.title || "Untitled book"));
    if (book.subtitle) out.push("*" + book.subtitle + "*");
    if (book.author) out.push("**" + book.author + "**");
    var meta = [];
    if (book.coAuthors) meta.push("Co-authors: " + book.coAuthors);
    if (book.publisher) meta.push("Publisher: " + book.publisher);
    if (book.edition) meta.push("Edition: " + book.edition);
    if (book.copyrightYear) meta.push("Copyright: " + book.copyrightYear);
    if (book.isbn) meta.push("ISBN (author-supplied): " + book.isbn);
    if (meta.length) out.push(meta.join("  \n"));
    out.push("## Contents");
    out.push(BF.model.buildToc(book).filter(function (t) { return t.level <= 2; }).map(function (t) {
      return "- " + t.label;
    }).join("\n"));
    matterSections(book).forEach(function (m) {
      if (m.id === "titlePage" || m.id === "copyright") return;
      out.push("## " + m.name);
      if (m.content) out.push(htmlToMarkdown(m.content));
    });
    (book.chapters || []).forEach(function (ch) {
      out.push("## " + (ch.title || "Untitled chapter"));
      if (ch.content) out.push(htmlToMarkdown(ch.content));
    });
    backSections(book).forEach(function (m) {
      out.push("## " + m.name);
      if (m.id === "bibliography" || m.id === "references") {
        var list = BF.model.bibliography(book, book.settings.citationStyle || "apa");
        out.push(list.length ? list.map(function (p, i) {
          return (book.settings.citationStyle === "ieee" ? "[" + (i + 1) + "] " : "") + p.text;
        }).join("\n\n") : "_No sources have been entered yet._");
      } else if (m.content) out.push(htmlToMarkdown(m.content));
    });
    return out.join("\n\n") + "\n";
  }

  /* ============================================================ Plain text */
  function buildTxt(book) {
    var sep = "\n\n" + "=".repeat(60) + "\n\n";
    var out = [];
    out.push((book.title || "Untitled book").toUpperCase());
    if (book.subtitle) out.push(book.subtitle);
    if (book.author) out.push("by " + book.author);
    out.push("");
    matterSections(book).forEach(function (m) {
      out.push(sep);
      out.push(m.name.toUpperCase());
      out.push("");
      out.push(U.stripHtml(m.content || ""));
    });
    (book.parts || []).forEach(function (part) {
      var chapters = (book.chapters || []).filter(function (c) { return c.partId === part.id; });
      if (!chapters.length) return;
      out.push(sep);
      out.push(part.title.toUpperCase());
      chapters.forEach(function (ch) { pushChapterTxt(out, ch); });
    });
    (book.chapters || []).filter(function (c) { return !c.partId; }).forEach(function (ch) { pushChapterTxt(out, ch); });
    backSections(book).forEach(function (m) {
      out.push(sep);
      out.push(m.name.toUpperCase());
      out.push("");
      if (m.id === "bibliography" || m.id === "references") {
        out.push(BF.model.bibliography(book, book.settings.citationStyle || "apa").map(function (p) { return p.text; }).join("\n\n"));
      } else out.push(U.stripHtml(m.content || ""));
    });
    out.push("\n" + "-".repeat(40));
    out.push("Exported from BookForge Studio · " + new Date().toLocaleString());
    return out.join("\n");
  }

  function pushChapterTxt(out, ch) {
    out.push("\n\n" + ch.title.toUpperCase() + "\n" + "-".repeat(Math.max(8, ch.title.length)));
    out.push("");
    out.push(U.stripHtml(ch.content || "").replace(/\n{3,}/g, "\n\n").trim());
  }

  /* ============================================================= preflight */
  function preflight(book) {
    var technical = [];
    var editorial = [];
    var stats = BF.model.stats(book);
    var chapters = book.chapters || [];

    if (!book.title || !book.title.trim()) technical.push({ level: "error", message: "The book has no title. A title is required for every export format." });
    if (!book.author || !book.author.trim()) technical.push({ level: "warn", message: "No author name is set. Exports will show no author." });
    if (!book.language) technical.push({ level: "warn", message: "No language is set. EPUB will default to English." });
    if (!book.publisher) technical.push({ level: "info", message: "No publisher or imprint is set (optional)." });
    if (!book.isbn) technical.push({ level: "info", message: "No ISBN supplied. BookForge never generates or registers ISBNs for you." });
    if (!book.copyrightYear) technical.push({ level: "warn", message: "Copyright year is empty; the copyright page template will omit it." });

    var empty = chapters.filter(function (c) { return !U.stripHtml(c.content || "").trim(); });
    if (empty.length) technical.push({ level: "warn", message: empty.length + " chapter(s) are empty: " + empty.slice(0, 5).map(function (c) { return c.title; }).join(", ") + (empty.length > 5 ? "…" : "") });

    var missingImages = 0;
    var brokenLinks = 0;
    var noAlt = 0;
    chapters.forEach(function (ch) {
      var tpl = document.createElement("template");
      tpl.innerHTML = ch.content || "";
      Array.prototype.forEach.call(tpl.content.querySelectorAll("img"), function (img) {
        var src = img.getAttribute("src") || "";
        if (!src) missingImages++;
        if (!img.getAttribute("alt")) noAlt++;
      });
      Array.prototype.forEach.call(tpl.content.querySelectorAll("a[href]"), function (a) {
        var href = a.getAttribute("href") || "";
        if (!href || href === "#" || /^javascript:/i.test(href)) brokenLinks++;
      });
    });
    if (missingImages) technical.push({ level: "error", message: missingImages + " image(s) have no source and will not be exported." });
    if (noAlt) technical.push({ level: "warn", message: noAlt + " image(s) have no alternative text (accessibility)." });
    if (brokenLinks) technical.push({ level: "warn", message: brokenLinks + " link(s) are empty or broken." });

    var unresolved = (book.comments || []).filter(function (c) { return c.status !== "resolved"; });
    if (unresolved.length) editorial.push({ level: "warn", message: unresolved.length + " editorial comment(s) are still unresolved." });

    var uncited = (book.sources || []).filter(function (s) { return !s.title; });
    if (uncited.length) editorial.push({ level: "warn", message: uncited.length + " research source(s) have no title and cannot be cited correctly." });

    if (book.targetWords && stats.words < book.targetWords * 0.5) {
      editorial.push({ level: "info", message: "The manuscript is at " + Math.round(stats.progress * 100) + "% of the target word count." });
    }
    if (!(book.sources || []).length) editorial.push({ level: "info", message: "No research sources or references have been entered." });

    return {
      technical: technical,
      editorial: editorial,
      stats: stats,
      note: "Technical checks are automated. Editorial, factual and legal review remain the author's and publisher's responsibility — passing these checks does not verify scholarly accuracy."
    };
  }

  BF.exporters = {
    buildDocx: buildDocx,
    buildEpub: buildEpub,
    buildHtml: buildHtml,
    buildMarkdown: buildMarkdown,
    buildTxt: buildTxt,
    buildJson: function (book) { return JSON.stringify(BF.storage.exportProject(book), null, 2); },
    preflight: preflight,
    deepStats: BF.model.stats
  };
})();

</script>
<script data-src="js/image-editor.js">
(function () {
  "use strict";
  var BF = (window.BF = window.BF || {});
  var U = BF.util;
  var MAX_SIDE = 12000;

  function isDataUrl(src) { return /^data:image\//i.test(src || ""); }

  function mimeFromDataUrl(src) {
    var m = /^data:([^;,]+)/i.exec(src || "");
    return m ? m[1].toLowerCase() : "";
  }

  function normalizeMime(mime) {
    return mime === "image/jpg" ? "image/jpeg" : mime;
  }

  function mimeSupported(mime) {
    try {
      var canvas = document.createElement("canvas");
      canvas.width = 1;
      canvas.height = 1;
      return canvas.toDataURL(mime).indexOf("data:" + mime) === 0;
    } catch (e) {
      return false;
    }
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("The image could not be decoded.")); };
      img.src = src;
    });
  }

  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || "")); };
      reader.onerror = function () { reject(new Error("The encoded image could not be read.")); };
      reader.readAsDataURL(blob);
    });
  }

  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

  function formatLabel(mime) {
    if (mime === "image/jpeg") return "JPEG";
    if (mime === "image/png") return "PNG";
    if (mime === "image/webp") return "WebP";
    return String(mime || "image").replace(/^image\//, "").toUpperCase();
  }

  function open(opts) {
    opts = opts || {};
    var src = opts.src || "";
    if (!src) return Promise.reject(new Error("No image to edit."));
    return loadImage(src).then(build, function () { return build(null); });

    function build(img) {
      return new Promise(function (resolve) {
        var settled = false;
        var busy = false;
        var timer = null;
        var token = 0;
        var dlg = null;

        var srcW = img && img.naturalWidth ? img.naturalWidth : 0;
        var srcH = img && img.naturalHeight ? img.naturalHeight : 0;
        var canEdit = isDataUrl(src) && !!img && srcW > 1 && srcH > 1;
        var originalMime = normalizeMime(mimeFromDataUrl(src) || opts.mime || "image/png");
        var originalBytes = 0;
        if (typeof opts.size === "number" && opts.size > 0) originalBytes = opts.size;
        else if (isDataUrl(src)) {
          try { originalBytes = U.dataUrlToBytes(src).bytes.length; } catch (e) { originalBytes = 0; }
        }

        var formats = ["image/jpeg", "image/webp", "image/png"].filter(mimeSupported);
        if (!formats.length) formats = ["image/png", "image/jpeg"];
        var startMime = formats.indexOf(originalMime) >= 0 ? originalMime
          : (formats.indexOf("image/png") >= 0 ? "image/png" : formats[0]);

        var state = {
          rotation: 0,
          width: srcW || 0,
          height: srcH || 0,
          mime: startMime,
          quality: 82,
          displayWidth: clamp(Number(opts.displayWidth) || 100, 10, 100)
        };
        if (state.width > MAX_SIDE) {
          state.height = Math.round(state.height * MAX_SIDE / state.width);
          state.width = MAX_SIDE;
        }
        if (state.height > MAX_SIDE) {
          state.width = Math.round(state.width * MAX_SIDE / state.height);
          state.height = MAX_SIDE;
        }
        var initial = { width: state.width, height: state.height, rotation: 0, mime: state.mime, quality: state.quality };
        var initialDisplay = state.displayWidth;
        var allowWidth = opts.mode !== "asset" && opts.allowDisplayWidth !== false;

        function baseDims() {
          return state.rotation % 180 === 0 ? { w: srcW, h: srcH } : { w: srcH, h: srcW };
        }

        function changed() {
          if (!canEdit) return false;
          return state.rotation !== initial.rotation ||
            state.width !== initial.width ||
            state.height !== initial.height ||
            state.mime !== initial.mime ||
            state.quality !== initial.quality;
        }

        function paint(target, maxSide) {
          var scale = maxSide ? Math.min(1, maxSide / Math.max(state.width, state.height)) : 1;
          var w = Math.max(1, Math.round(state.width * scale));
          var h = Math.max(1, Math.round(state.height * scale));
          target.width = w;
          target.height = h;
          var ctx = target.getContext("2d");
          ctx.clearRect(0, 0, w, h);
          if (state.mime === "image/jpeg") {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);
          }
          ctx.save();
          ctx.translate(w / 2, h / 2);
          ctx.rotate(state.rotation * Math.PI / 180);
          var drawW = state.rotation % 180 === 0 ? w : h;
          var drawH = state.rotation % 180 === 0 ? h : w;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
          ctx.restore();
        }

        function encode() {
          return new Promise(function (resolveEncoded, rejectEncoded) {
            var out = document.createElement("canvas");
            try { paint(out, 0); } catch (e) {
              rejectEncoded(new Error("The image could not be prepared for encoding."));
              return;
            }
            function done(blob) {
              if (!blob) {
                rejectEncoded(new Error("This browser could not encode the image."));
                return;
              }
              blobToDataUrl(blob).then(function (dataUrl) {
                var mime = "";
                try { mime = U.dataUrlToBytes(dataUrl).mime; } catch (e) { mime = state.mime; }
                resolveEncoded({
                  dataUrl: dataUrl,
                  mime: mime || state.mime,
                  size: blob.size,
                  width: out.width,
                  height: out.height
                });
              }, rejectEncoded);
            }
            try {
              if (state.mime === "image/png") out.toBlob(done, "image/png");
              else out.toBlob(done, state.mime, state.quality / 100);
            } catch (e) {
              rejectEncoded(new Error("The browser blocked reading this image (cross-origin content)."));
            }
          });
        }

        var preview = U.el("div", { class: "img-editor-preview" + (canEdit ? " is-checker" : "") });
        var canvas = null;
        if (canEdit) {
          canvas = U.el("canvas", { class: "img-editor-canvas", "aria-label": "Image preview" });
          preview.appendChild(canvas);
        } else if (img) {
          img.className = "img-editor-canvas";
          img.alt = opts.name || "Image preview";
          preview.appendChild(img);
        } else {
          preview.appendChild(U.el("div", { class: "img-editor-missing", text: "Preview unavailable. The image could not be loaded." }));
        }

        function originalText() {
          var bits = [];
          if (srcW && srcH) bits.push(srcW + " × " + srcH + " px");
          if (originalBytes) bits.push(U.formatBytes(originalBytes));
          bits.push(formatLabel(originalMime));
          return bits.join(" · ");
        }

        var newValue = U.el("b", { class: "img-editor-new", "aria-live": "polite", text: canEdit ? "Unchanged — original file" : "Linked image" });
        var stats = U.el("div", { class: "img-editor-stats" }, [
          U.el("div", { class: "img-editor-stat" }, [
            U.el("span", { class: "img-editor-stat-label", text: "Original" }),
            U.el("b", { text: originalText() })
          ]),
          U.el("div", { class: "img-editor-stat" }, [
            U.el("span", { class: "img-editor-stat-label", text: "New" }),
            newValue
          ])
        ]);
        preview.appendChild(stats);

        function setNew(text, cls) {
          newValue.textContent = text;
          newValue.className = "img-editor-new" + (cls ? " " + cls : "");
        }

        var controls = U.el("div", { class: "img-editor-controls" });
        var widthInput = null;
        var heightInput = null;
        var lockInput = null;
        var formatSelect = null;
        var qualityInput = null;
        var qualityOut = null;
        var qualityField = null;
        var formatHelp = null;
        var displayInput = null;
        var displayOut = null;
        var presetButtons = [];

        function displayText() {
          var text = state.displayWidth + "% of text width";
          if (opts.contentWidthPx) text += " · about " + Math.round(opts.contentWidthPx * state.displayWidth / 100) + " px on the page";
          return text;
        }

        function formatHelpText() {
          if (state.mime === "image/jpeg") return "Best compatibility in Word and most e-readers. Transparency becomes white.";
          if (state.mime === "image/webp") return "Smallest files, but older versions of Word and some e-readers cannot display WebP.";
          return "Lossless and keeps transparency. Photographs usually stay large.";
        }

        function setWidth(value, lock) {
          var base = baseDims();
          var maxW = Math.min(base.w, MAX_SIDE);
          var w = clamp(Math.round(Number(value) || 1), 1, maxW);
          state.width = w;
          if (lock) {
            var h = Math.round(w * base.h / base.w);
            if (h > MAX_SIDE) {
              h = MAX_SIDE;
              state.width = clamp(Math.round(h * base.w / base.h), 1, maxW);
            }
            state.height = clamp(h, 1, Math.min(base.h, MAX_SIDE));
          } else {
            state.height = clamp(state.height, 1, Math.min(base.h, MAX_SIDE));
          }
          syncUI();
        }

        function setHeight(value, lock) {
          var base = baseDims();
          var maxH = Math.min(base.h, MAX_SIDE);
          var h = clamp(Math.round(Number(value) || 1), 1, maxH);
          state.height = h;
          if (lock) {
            var w = Math.round(h * base.w / base.h);
            if (w > MAX_SIDE) {
              w = MAX_SIDE;
              state.height = clamp(Math.round(w * base.h / base.w), 1, maxH);
            }
            state.width = clamp(w, 1, Math.min(base.w, MAX_SIDE));
          } else {
            state.width = clamp(state.width, 1, Math.min(base.w, MAX_SIDE));
          }
          syncUI();
        }

        function applyPreset(value) {
          var base = baseDims();
          var w = value ? Math.min(value, base.w) : Math.min(base.w, MAX_SIDE);
          state.width = clamp(Math.round(w), 16, MAX_SIDE);
          state.height = clamp(Math.round(state.width * base.h / base.w), 16, MAX_SIDE);
          syncUI();
        }

        function rotate() {
          var prevW = state.width;
          var prevH = state.height;
          state.rotation = (state.rotation + 90) % 360;
          var base = baseDims();
          state.width = clamp(prevH, 16, Math.min(base.w, MAX_SIDE));
          state.height = clamp(prevW, 16, Math.min(base.h, MAX_SIDE));
          syncUI();
        }

        function reset() {
          state.rotation = initial.rotation;
          state.width = initial.width;
          state.height = initial.height;
          state.mime = initial.mime;
          state.quality = initial.quality;
          syncUI();
        }

        function scheduleEstimate() {
          clearTimeout(timer);
          var my = ++token;
          if (!canEdit) {
            setNew(img ? "Linked image — display width only" : "No editable image data");
            return;
          }
          if (!changed()) {
            setNew(originalBytes ? "Unchanged — original file" : "Unchanged");
            return;
          }
          setNew("Estimating…");
          timer = setTimeout(function () {
            encode().then(function (res) {
              if (my !== token || settled) return;
              var text = state.width + " × " + state.height + " px · " + U.formatBytes(res.size) + " · " + formatLabel(res.mime);
              var cls = "";
              if (originalBytes) {
                var saved = Math.round((1 - res.size / originalBytes) * 100);
                if (saved > 0) { cls = "img-gain"; text += " · " + saved + "% smaller"; }
                else if (saved < 0) { cls = "img-loss"; text += " · " + Math.abs(saved) + "% larger"; }
                else text += " · same size";
              }
              setNew(text, cls);
            }).catch(function (err) {
              if (my !== token || settled) return;
              setNew(err.message, "img-loss");
            });
          }, 240);
        }

        function refreshPrimary() {
          if (!dlg) return;
          var dirty = changed() || (allowWidth && state.displayWidth !== initialDisplay);

        function setBusy(on) {
          busy = on;
          footButtons.forEach(function (b) { b.disabled = on; });
          if (!on) refreshPrimary();
        }

        function finish(result) {
          if (settled) return;
          settled = true;
          resolve(result);
        }

        function apply(action, close) {
          if (busy) return;
          if (!canEdit || !changed()) {
            finish({
              action: action,
              dataUrl: src,
              mime: originalMime,
              size: originalBytes,
              width: srcW,
              height: srcH,
              displayWidth: state.displayWidth
            });
            close();
            return;
          }
          setBusy(true);
          setNew("Encoding…");
          encode().then(function (res) {
            finish({
              action: action,
              dataUrl: res.dataUrl,
              mime: res.mime,
              size: res.size,
              width: res.width,
              height: res.height,
              displayWidth: state.displayWidth
            });
            close();
          }).catch(function (err) {
            setBusy(false);
            setNew(err.message, "img-loss");
            if (BF.app && BF.app.toast) BF.app.toast(err.message, "error");
          });
        }

        syncUI();
      });
    }
  }

  BF.imageEditor = { open: open };
})();

<script data-src="js/text-tools.js">
/* BookForge Studio — local text clean-up and paragraph formatting.
   Works on a detached DOM copy so the manuscript is never touched until the
   caller applies the returned HTML. No network, no AI, no invented content. */
(function () {
  "use strict";
  var BF = (window.BF = window.BF || {});
  var U = BF.util;

  var DEFAULTS = {
    spaces: true,
    punctuation: true,
    quotes: true,
    capitalize: true,
    ellipses: true,
    dashes: true,
    trim: true,
    empty: true
  };

  var BLOCK_TAGS = {
    P: 1, DIV: 1, H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1,
    LI: 1, BLOCKQUOTE: 1, FIGCAPTION: 1, TD: 1, TH: 1, CAPTION: 1
  };
  var NESTED_TAGS = { UL: 1, OL: 1, TABLE: 1, FIGURE: 1, THEAD: 1, TBODY: 1, TFOOT: 1, TR: 1 };
  var SKIP_TAGS = { CODE: 1, PRE: 1, KBD: 1, SAMP: 1, SCRIPT: 1, STYLE: 1, TEXTAREA: 1, MATH: 1 };
  var EMBED_TAGS = { IMG: 1, HR: 1, SVG: 1, VIDEO: 1, AUDIO: 1, IFRAME: 1, OBJECT: 1, EMBED: 1, CANVAS: 1 };
  var MEDIA_SELECTOR = "img,svg,video,audio,iframe,object,embed,canvas,table,figure,hr";
  var ABBREVIATIONS = /^(mr|mrs|ms|dr|prof|rev|sr|jr|st|vs|etc|fig|figs|no|nos|vol|vols|ch|chs|pp|p|ed|eds|al|approx|dept|est|min|max)$/i;

  function inSkippedArea(el, root) {
    var node = el;
    while (node && node !== root) {
      if (node.nodeType === 1 && SKIP_TAGS[node.tagName]) return true;
      node = node.parentNode;
    }
    return false;
  }

  function textNodesOf(block) {
    var out = [];
    (function walk(node) {
      for (var child = node.firstChild; child; child = child.nextSibling) {
        if (child.nodeType === 3) {
          out.push(child);
        } else if (child.nodeType === 1) {
          if (SKIP_TAGS[child.tagName] || EMBED_TAGS[child.tagName] || NESTED_TAGS[child.tagName]) continue;
          if (child !== block && BLOCK_TAGS[child.tagName]) continue;
          if (inSkippedArea(child, block)) continue;
          walk(child);
        }
      }
    })(block);
    return out;
  }

  function joined(nodes) {
    return nodes.map(function (n) { return n.nodeValue || ""; }).join("");
  }

  function writeJoined(nodes, text) {
    var offset = 0;
    nodes.forEach(function (node) {
      var len = (node.nodeValue || "").length;
      node.nodeValue = text.slice(offset, offset + len);
      offset += len;
    });
  }

  function nonSpaceBefore(text, index) {
    for (var i = index - 1; i >= 0; i--) if (!/\s/.test(text.charAt(i))) return text.charAt(i);
    return "";
  }

  function nonSpaceAfter(text, index) {
    for (var i = index + 1; i < text.length; i++) if (!/\s/.test(text.charAt(i))) return text.charAt(i);
    return "";
  }

  function isWordChar(ch) { return /[A-Za-zÀ-ÖØ-öø-ÿ0-9]/.test(ch); }

  function smartQuotes(nodes, stats) {
    var text = joined(nodes);
    if (text.indexOf('"') < 0 && text.indexOf("'") < 0) return;
    var out = text.split("");
    for (var i = 0; i < out.length; i++) {
      var ch = out[i];
      var immediateBefore = i > 0 ? text.charAt(i - 1) : "";
      var before = nonSpaceBefore(text, i);
      var after = nonSpaceAfter(text, i);
      var atBoundary = !immediateBefore || /\s/.test(immediateBefore);
      if (ch === '"') {
        out[i] = atBoundary || /[([{—–-]/.test(immediateBefore) ? "“" : "”";
        stats.quotes++;
      } else if (ch === "'") {
        if (atBoundary) {
          if (/^(?:tis|twas|em|cause|round|bout|til|n)\b/i.test(text.slice(i + 1))) out[i] = "’";
          else if (/\d/.test(after)) out[i] = "’";
          else out[i] = "‘";
        } else if (isWordChar(before) && isWordChar(after)) out[i] = "’";
        else if (isWordChar(before) || /[.,!?;:”’)\]]/.test(before)) out[i] = "’";
        else out[i] = "‘";
        stats.quotes++;
      }
    }
    writeJoined(nodes, out.join(""));
  }

  function firstLetterIndex(text) {
    var leading = text.replace(/^\s+/, "");
    if (/^(?:…|\.\.\.)/.test(leading)) return -1;
    var m = /[A-Za-zÀ-ÖØ-öø-ÿ]/.exec(leading);
    if (!m) return -1;
    return text.indexOf(leading) + m.index;
  }

  function capitalizeSentences(nodes, stats) {
    var text = joined(nodes);
    if (!text.trim()) return;
    var indices = [];
    var first = firstLetterIndex(text);
    if (first >= 0) indices.push(first);
    var re = /([.!?])["'”’)\]]*\s+([a-zà-öø-ÿ])/g;
    var m;
    while ((m = re.exec(text))) {
      var end = m.index;
      var before = text.slice(0, end);
      var token = /([A-Za-z][A-Za-z.]*)$/.exec(before);
      if (token) {
        var word = token[1];
        if (word.indexOf(".") >= 0 || ABBREVIATIONS.test(word)) continue;
      }
      var startIndex = m.index + m[0].length - 1;
      if (/^[a-zà-öø-ÿ](?:\.[a-zà-öø-ÿ]){1,3}\./i.test(text.slice(startIndex))) continue;
      indices.push(startIndex);
    }
    if (!indices.length) return;
    var offset = 0;
    var starts = nodes.map(function (node) {
      var s = offset;
      offset += (node.nodeValue || "").length;
      return s;
    });
    indices.forEach(function (index) {
      var upper = text.charAt(index).toUpperCase();
      if (upper === text.charAt(index)) return;
      for (var i = 0; i < nodes.length; i++) {
        var len = (nodes[i].nodeValue || "").length;
        if (index >= starts[i] && index < starts[i] + len) {
          var local = index - starts[i];
          var value = nodes[i].nodeValue;
          nodes[i].nodeValue = value.slice(0, local) + upper + value.slice(local + 1);
          text = text.slice(0, index) + upper + text.slice(index + 1);
          stats.capitalized++;
          return;
        }
      }
    });
  }

    var t = value;
    if (stats.options.ellipses) {
      t = t.replace(/\.\s*\.\s*\./g, function () { stats.ellipses++; return "…"; });
    }
    if (stats.options.dashes) {
      t = t.replace(/\s*--\s*/g, function () { stats.dashes++; return " — "; });
      t = t.replace(/^ — /, "— ").replace(/ —$/, " —");
    }
    if (stats.options.spaces) {
      t = t.replace(/[ \t]{2,}/g, function () { stats.spaces++; return " "; });
    }
    if (stats.options.punctuation) {
      t = t.replace(/[ \t]+([,.;:!?])/g, function (m, p) { stats.punctuation++; return p; });
      t = t.replace(/(^|[^A-Za-z0-9])([A-Za-zÀ-ÖØ-öø-ÿ]{2,})([.!?])(?=[A-ZÀ-ÖØ-Þ])/g, function (m, lead, word, p) {

        return lead + word + p + " ";
      });
      t = t.replace(/([,;!?])(?=[A-Za-zÀ-ÖØ-öø-ÿ])/g, function (m, p) { stats.punctuation++; return p + " "; });
      t = t.replace(/(:)(?=[A-ZÀ-ÖØ-Þ])/g, function (m, p) { stats.punctuation++; return p + " "; });
      t = t.replace(/([.!?])(?=[“'‘])/g, function (m, p) { stats.punctuation++; return p + " "; });
      t = t.replace(/(”)(?=[A-Za-zÀ-ÖØ-öø-ÿ])/g, function (m, p) { stats.punctuation++; return p + " "; });

  }

  function trimBlock(nodes, stats) {
    for (var i = 0; i < nodes.length; i++) {
      var value = nodes[i].nodeValue || "";

      var v = nodes[j].nodeValue || "";

      }
      break;
    }
  }

  function emptyBlocks(root) {
    var removed = 0;
    (function walk(container) {
      Array.prototype.slice.call(container.children).forEach(function (el) {
        if (el.children.length) walk(el);
        if (!el.parentNode) return;
        if (el.tagName !== "P" && el.tagName !== "DIV") return;

    return removed;
  }

  function clean(html, options) {
    var opts = {};
    Object.keys(DEFAULTS).forEach(function (k) { opts[k] = options && options[k] != null ? !!options[k] : DEFAULTS[k]; });
    var tpl = document.createElement("template");
    tpl.innerHTML = html || "";
    var root = tpl.content;
    var stats = {
      options: opts,
      spaces: 0, punctuation: 0, quotes: 0, capitalized: 0,
      ellipses: 0, dashes: 0, trimmed: 0, empty: 0, blocks: 0
    };
    var samples = [];

    var blocks = Array.prototype.slice.call(root.querySelectorAll("p,div,h1,h2,h3,h4,h5,h6,li,blockquote,figcaption,td,th,caption"));
    blocks.forEach(function (block) {
      if (inSkippedArea(block, root)) return;
      var nodes = textNodesOf(block);
      if (!nodes.length) return;
      var beforeText = joined(nodes);
      var beforeHtml = block.outerHTML;
      if (opts.quotes) smartQuotes(nodes, stats);
      if (opts.ellipses || opts.dashes || opts.spaces || opts.punctuation) {
        nodes.forEach(function (node) {
          var value = node.nodeValue || "";
          if (!value) return;
          node.nodeValue = cleanTextValue(value, stats);
        });
      }
      if (opts.capitalize) capitalizeSentences(nodes, stats);
      if (opts.trim) trimBlock(nodes, stats);
      var afterText = joined(nodes);
      if (block.outerHTML !== beforeHtml) {
        stats.blocks++;
        if (samples.length < 3 && beforeText !== afterText && beforeText.trim()) {
          samples.push({
            before: beforeText.length > 700 ? beforeText.slice(0, 700) + "…" : beforeText,
            after: afterText.length > 700 ? afterText.slice(0, 700) + "…" : afterText
          });
        }
      }
    });

    if (opts.empty) stats.empty = emptyBlocks(root);

    var total = stats.spaces + stats.punctuation + stats.quotes + stats.capitalized +
      stats.ellipses + stats.dashes + stats.trimmed + stats.empty;
    return {
      html: tpl.innerHTML,
      changed: total > 0,
      stats: stats,
      samples: samples

  }

    var bits = [];
    if (stats.blocks) bits.push(stats.blocks + " paragraph" + (stats.blocks === 1 ? "" : "s") + " changed");
    if (stats.quotes) bits.push(stats.quotes + " quote mark" + (stats.quotes === 1 ? "" : "s") + " converted");
    if (stats.spaces) bits.push(stats.spaces + " spacing run" + (stats.spaces === 1 ? "" : "s") + " collapsed");
    if (stats.punctuation) bits.push(stats.punctuation + " punctuation gap" + (stats.punctuation === 1 ? "" : "s") + " fixed");

    if (stats.empty) bits.push(stats.empty + " empty paragraph" + (stats.empty === 1 ? "" : "s") + " removed");
    return bits.join(" · ");
  }

  BF.textTools = { clean: clean, summary: summary, DEFAULTS: DEFAULTS };
})();

  /* =============================================================== manuscript */
  function trimLabel(geo) {
    function fmt(n) { return String(Math.round(n * 100) / 100).replace(/\.0+$/, ""); }
    return fmt(geo.trimW / 25.4) + " × " + fmt(geo.trimH / 25.4) + " in";
  }

  function pageViewReady() {
    var overlay = document.getElementById("overlay");
    return !!(S && S.pageView && S.view === "manuscript" && (!overlay || overlay.hidden));
  }

  var pageResizeTimer = null;
  window.addEventListener("resize", function () {
    if (!pageViewReady()) return;
    clearTimeout(pageResizeTimer);
    pageResizeTimer = setTimeout(function () {
      if (pageViewReady()) A().render();
    }, 250);
  });

  function scrollToPageCard(card, smooth) {
    if (!card) return;
    var main = document.getElementById("main");
    if (!main) return;
    var offset = card.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop;
    var top = Math.max(0, offset - 52);
    if (smooth && typeof main.scrollTo === "function") main.scrollTo({ top: top, behavior: "smooth" });
    else main.scrollTop = top;
  }

  var draftPageState = null;
  var draftPageTimer = null;

  function wordOffsetAtCaret(surface) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || !surface.contains(sel.anchorNode)) return null;
    var range = document.createRange();
    range.selectNodeContents(surface);
    try { range.setEnd(sel.anchorNode, sel.anchorOffset); } catch (e) { return null; }
    var frag = range.cloneContents();
    var host = document.createElement("div");
    host.appendChild(frag);
    var blocks = Array.prototype.slice.call(host.children);
    if (!blocks.length) return U.countWords(host.textContent || "");
    return blocks.reduce(function (n, block) {
      return n + U.countWords(block.textContent || "");
    }, 0);
  }

  function ensureSidebarPageIndicator() {
    var host = document.getElementById("sidebar");
    if (!host) return null;
    var foot = host.querySelector(".sidebar-foot") || host;
    var el = document.getElementById("sidebarPageIndicator");
    if (!el) {
      el = U.el("div", {
        class: "sidebar-page-indicator", id: "sidebarPageIndicator",
        title: "Page position at the cursor in Draft, or the page scrolled into view in Pages."
      }, [
        U.el("div", { class: "sidebar-page-track", id: "sidebarPageTrack" }, [
          U.el("div", { class: "sidebar-page-fill", id: "sidebarPageFill" })
        ]),
        U.el("div", { class: "sidebar-page-label" }, [
          U.el("b", { id: "sidebarPageCurrent", text: "—" }),
          U.el("span", { text: "/" }),
          U.el("span", { id: "sidebarPageTotal", text: "—" })
        ])
      ]);
      foot.appendChild(el);
    }
    bindMainScroll();
    return el;
  }

  function setSidebarPage(page, total) {
    var fill = document.getElementById("sidebarPageFill");
    var cur = document.getElementById("sidebarPageCurrent");
    var tot = document.getElementById("sidebarPageTotal");
    if (cur) cur.textContent = String(page);
    if (tot) tot.textContent = String(total);
    if (fill && total > 0) {
      fill.style.height = Math.max(6, Math.min(100, Math.round(page / total * 100))) + "%";
    }
  }

  var mainScrollBound = false;

  function bindMainScroll() {
    if (mainScrollBound) return;
    var main = document.getElementById("main");
    if (!main) return;
    mainScrollBound = true;
    var ticking = false;
    main.addEventListener("scroll", function () {
      if (!document.body.classList.contains("pages-mode")) return;
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        ticking = false;
        updateSidebarPagesScroll();
      });
    });
  }

  function updateSidebarPagesScroll() {
    if (!document.body.classList.contains("pages-mode")) return;
    var cards = U.qsa("#view .page-card");
    if (!cards.length) return;
    var main = document.getElementById("main");
    var line = (main ? main.getBoundingClientRect().top : 0) + 80;
    var current = cards[0];
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].getBoundingClientRect().bottom > line) { current = cards[i]; break; }
    }
    setSidebarPage(cards.indexOf(current) + 1, cards.length);
  }

  function updateDraftPageIndicator(surface, ch) {
    var current = document.getElementById("draftPageCurrent");
    var total = document.getElementById("draftPageTotal");
    if (!current || !total || !draftPageState || draftPageState.chapterId !== ch.id) return;
    if (draftPageState.updatedAt !== ch.updatedAt || draftPageState.title !== ch.title) return;
    var offset = wordOffsetAtCaret(surface);
    if (offset == null) offset = 0;
    var page = 1;
    for (var i = 0; i < draftPageState.ranges.length; i++) {
      page = i + 1;
      if (offset < draftPageState.ranges[i].end) break;
    }
    current.textContent = String(page);
    total.textContent = String(draftPageState.total);
    setSidebarPage(page, draftPageState.total);
  }

  function scheduleDraftPageMap(b, ch, surface, delay) {
    if (!BF.layout || typeof BF.layout.chapterPageMap !== "function") return;
    clearTimeout(draftPageTimer);
    draftPageTimer = setTimeout(function () {
      if (!S || S.pageView || S.view !== "manuscript" || S.chapterId !== ch.id) return;
      var designKey = "";
      try { designKey = JSON.stringify(b.design || {}); } catch (e) { designKey = ""; }
      if (draftPageState &&
          draftPageState.chapterId === ch.id &&
          draftPageState.updatedAt === ch.updatedAt &&
          draftPageState.title === ch.title &&
          draftPageState.designKey === designKey) {
        updateDraftPageIndicator(surface, ch);
        return;
      }
      var map;
      try { map = BF.layout.chapterPageMap(b, ch); } catch (e) { return; }
      if (!map) return;
      draftPageState = {
        chapterId: ch.id, updatedAt: ch.updatedAt, title: ch.title, designKey: designKey,
        ranges: map.pages, total: map.total
      };
      updateDraftPageIndicator(surface, ch);
    }, delay || 400);
  }

  function manuscriptBar(b, ch) {
    var bar = U.el("div", { class: "manuscript-bar" + (S.pageView ? " is-pages" : "") });
    var seg = U.el("div", { class: "seg", role: "group", "aria-label": "Manuscript view" });
    var draft = U.el("button", {
      type: "button", text: "Draft", "aria-pressed": S.pageView ? "false" : "true",
      onclick: function () { if (S.pageView) A().setPageView(false); }
    });
    var pages = U.el("button", {
      type: "button", text: "Pages", "aria-pressed": S.pageView ? "true" : "false",

    });

    seg.appendChild(pages);

    bar.appendChild(U.el("span", {
      class: "bar-meta", id: "pageViewInfo",
      title: "Page size: " + trim + ". Change it in Design studio.",
      text: S.pageView ? "Laying out pages…" : "Chapter " + index + " of " + b.chapters.length + " · Page size " + trim + " · " + BF.model.chapterWords(ch).toLocaleString() + " words"
    }));

    if (!S.pageView) {
      bar.appendChild(U.el("span", {
        class: "draft-page-indicator", id: "draftPageIndicator",

      }, [
        U.el("span", { text: "Page " }),
        U.el("b", { id: "draftPageCurrent", text: "—" }),
        U.el("span", { text: " of " }),
        U.el("span", { id: "draftPageTotal", text: "—" })
      ]));
      ensureSidebarPageIndicator();
    }

    var actions = U.el("div", { class: "bar-actions" });
    actions.appendChild(U.el("button", {
      type: "button", class: "btn ghost sm", text: "Clean up & format",
      onclick: function () { A().openCleanupDialog(); }
    }));
    if (S.pageView) {
      actions.appendChild(U.el("button", {
        type: "button", class: "btn ghost sm", text: "Jump to my chapter",
        onclick: function () {
          var target = U.qsa(".page-card.is-current").filter(function (el) { return el.dataset.chapter === S.chapterId; })[0];
          scrollToPageCard(target, true);
        }
      }));
      actions.appendChild(U.el("button", {
        type: "button", class: "btn ghost sm", text: "Refresh pages",
        onclick: function () { A().render(); }
      }));
      actions.appendChild(U.el("button", {
        type: "button", class: "btn ghost sm", text: "Page setup",
        onclick: function () { A().setView("design"); }
      }));
    }
    bar.appendChild(actions);
    return bar;
  }

  function pagesCanvas(b, ch) {
    var canvas = U.el("div", { class: "canvas-wrap is-pages" });
    var host = U.el("div", { class: "page-view", role: "region", "aria-label": "Manuscript pages" });
    host.appendChild(U.el("div", { class: "page-loading", text: "Laying out pages…" }));
    canvas.appendChild(host);

    setTimeout(function () {
      if (!document.body.contains(host) || !S.pageView || S.view !== "manuscript") return;
      var cs = window.getComputedStyle(canvas);
      var main = document.getElementById("main");
      var availW = (canvas.clientWidth || 760) - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0) - 2;
      var availH = (main ? main.clientHeight : window.innerHeight) - 145;
      var geo = BF.layout.geometry(b);
      var pageW = geo.trimW * 96 / 25.4;
      var pageH = geo.trimH * 96 / 25.4;
      var widthScale = Math.max(240, availW) / pageW;
      var heightScale = Math.max(220, availH) / pageH;
      var scale = Math.max(0.34, Math.min(1, widthScale, Math.max(0.62, heightScale)));
      scale = Math.floor(scale * 1000) / 1000;
      var res;
      try {
        res = BF.layout.renderPages(host, b, {
          scale: scale,
          chapterId: S.chapterId,
          onEditChapter: function (id) { A().openChapter(id); },
          onOpenMatter: function () { A().setView("matter"); }
        });
      } catch (e) {
        host.innerHTML = "";
        host.appendChild(U.el("div", { class: "empty" }, [
          U.el("h3", { text: "Pages could not be laid out" }),
          U.el("p", { text: e.message })
        ]));
        return;
      }
      var info = document.getElementById("pageViewInfo");
      if (info) info.textContent = res.pages.length + " pages · " + trimLabel(geo) + " · read-only proof";
      var stPage = document.getElementById("stPage");
      if (stPage) stPage.textContent = res.pages.length + " pages (exact)";
      ensureSidebarPageIndicator();
      scrollToPageCard(host.querySelector(".page-card.is-current"), false);
      updateSidebarPagesScroll();
    }, 30);

    return canvas;
  }

  function manuscript() {
    A();
    var b = book();
    if (!b) return needBook();
    if (!b.chapters.length) {
      b.chapters.push(BF.model.createChapter("Chapter 1", { order: 1 }));
      S.chapterId = b.chapters[0].id;
    }
    if (!S.chapterId || !b.chapters.some(function (c) { return c.id === S.chapterId; })) S.chapterId = b.chapters[0].id;
    var ch = A().currentChapter();

    var wrap = U.el("div");
    wrap.appendChild(manuscriptBar(b, ch));
    if (S.pageView) {
      S.editor = null;
      wrap.appendChild(pagesCanvas(b, ch));
      return wrap;
    }

    var toolbar = buildToolbar();
    var shell = U.el("div", { class: "editor-shell" });
    shell.appendChild(toolbar);

    var canvasWrap = U.el("div", { class: "canvas-wrap" });
    var sheet = U.el("div", { class: "page-sheet" });
    var chapterIndex = b.chapters.filter(function (c) { return c.order < ch.order; }).length + 1;
    sheet.appendChild(U.el("div", { class: "chapter-kicker", id: "chapterKicker", text: (b.parts.some(function (p) { return p.id === ch.partId; }) ? "Part " + partName(b, ch.partId) + " · " : "") + "Chapter " + chapterIndex + " · " + BF.model.chapterWords(ch).toLocaleString() + " words" }));
    var title = U.el("input", {
      class: "chapter-heading", value: ch.title, "aria-label": "Chapter title",
      style: "width:100%;border:0;background:transparent;color:inherit;font-size:1.6em;font-weight:600;padding:0 0 10px;margin-bottom:14px;border-bottom:1px solid var(--canvas-line)"
    });
    title.addEventListener("input", function () {
      ch.title = title.value || "Untitled chapter";
      A().markDirty();
      A().renderContext();
      updateChapterKicker();
      scheduleDraftPageMap(b, ch, surface, 350);
    });
    sheet.appendChild(title);

    var surface = U.el("div", { class: "manuscript", contenteditable: "true", spellcheck: "true", role: "textbox", "aria-multiline": "true", "aria-label": "Chapter manuscript" });
    surface.innerHTML = ch.content || "";
    sheet.appendChild(surface);
    canvasWrap.appendChild(sheet);
    shell.appendChild(canvasWrap);
    wrap.appendChild(shell);

    S.editor = new BF.Editor(surface, {
      onChange: function () {
        ch.content = S.editor.getHtml();
        ch.updatedAt = Date.now();
        A().markDirty();
        updateChapterKicker();
        scheduleDraftPageMap(b, ch, surface, 350);
      },
      onStats: function () {
        A().renderStatus();
      },
      onSelectionState: function (state) {
        paintToolbar(state);
        var sel = window.getSelection();
        var text = sel ? String(sel) : "";
        var box = document.getElementById("ctxSelection");
        if (box) box.textContent = text.trim() ? U.countWords(text) + " words, " + text.length + " characters selected" : "Select text in the manuscript to see word count.";
        updateDraftPageIndicator(surface, ch);
      },
      onSave: function () { A().saveNow("manual"); },
      onFind: function () { A().openFind(); },
      onImageFile: function (file) {
        U.fileToDataUrl(file).then(function (url) {
          A().addAsset(file.name, url, file.type, file.size, file.name, false);
          S.editor.insertImage(url, file.name);
          A().markDirty();
        });
      },
      onImageDblClick: function (img) { A().editInlineImage(img); },
      typewriter: function () { return S.mode === "typewriter"; },
      scroller: function () { return document.getElementById("main"); }
    });
    scheduleDraftPageMap(b, ch, surface, 80);
    updateDraftPageIndicator(surface, ch);

    return wrap;
  }

  function partName(b, partId) {
    var p = b.parts.filter(function (x) { return x.id === partId; })[0];
    return p ? p.title : "";
  }

  function updateChapterKicker() {
    var b = book();
    var ch = A().currentChapter();
    var el = document.getElementById("chapterKicker");
    if (!el || !b || !ch) return;
    var idx = b.chapters.filter(function (c) { return c.order < ch.order; }).length + 1;
    el.textContent = (ch.partId && partName(b, ch.partId) ? "Part " + partName(b, ch.partId) + " · " : "") + "Chapter " + idx + " · " + BF.model.chapterWords(ch).toLocaleString() + " words";
  }

  function buildToolbar() {
    var bar = U.el("div", { class: "editor-toolbar", role: "toolbar", "aria-label": "Formatting" });
    var e = function () { return S.editor; };
    function group(children) { return U.el("div", { class: "group" }, children); }
    function tb(label, title, onClick, id) {
      var b = U.el("button", { type: "button", title: title, "aria-label": title, "data-cmd": id || "", onclick: onClick }, [label]);
      return b;
    }

    var blockSelect = U.el("select", { title: "Paragraph style", "aria-label": "Paragraph style" });
    [["p", "Body text"], ["h1", "Heading 1"], ["h2", "Heading 2"], ["h3", "Heading 3"], ["blockquote", "Block quote"]].forEach(function (o) {
      blockSelect.appendChild(U.el("option", { value: o[0], text: o[1] }));
    });
    blockSelect.addEventListener("change", function () {
      e().formatBlock(blockSelect.value);
      A().markDirty();
    });
    bar.appendChild(blockSelect);

    bar.appendChild(group([
      tb("B", "Bold (Ctrl+B)", function () { e().exec("bold"); A().markDirty(); }, "bold"),
      tb("I", "Italic (Ctrl+I)", function () { e().exec("italic"); A().markDirty(); }, "italic"),
      tb("U", "Underline (Ctrl+U)", function () { e().exec("underline"); A().markDirty(); }, "underline"),
      tb("S", "Strikethrough", function () { e().exec("strikeThrough"); A().markDirty(); }, "strikeThrough")
    ]));
    bar.appendChild(group([
      tb("•", "Bulleted list", function () { e().exec("insertUnorderedList"); A().markDirty(); }, "insertUnorderedList"),
      tb("1.", "Numbered list", function () { e().exec("insertOrderedList"); A().markDirty(); }, "insertOrderedList"),
      tb("❝", "Block quote", function () { e().formatBlock("blockquote"); A().markDirty(); })
    ]));
    bar.appendChild(group([
      tb("⇤", "Align left", function () { e().exec("justifyLeft"); A().markDirty(); }, "justifyLeft"),
      tb("↔", "Align centre", function () { e().exec("justifyCenter"); A().markDirty(); }, "justifyCenter"),
      tb("⇥", "Align right", function () { e().exec("justifyRight"); A().markDirty(); }, "justifyRight"),
      tb("☰", "Justify", function () { e().exec("justifyFull"); A().markDirty(); }, "justifyFull")
    ]));

      tb("†", "Footnote", function () { A().insertFootnote(); }),

    ]));

  /* ================================================================== outline */
  function outline() {
    A();
    var b = book();
    if (!b) return needBook();
    sortChapters(b);
    var wrap = U.el("div");
    wrap.appendChild(viewHead("Book outline", "Parts, chapters and manuscript headings stay synchronised with the editor.", [
      btn("Add part", function () { addPart(); }),
      btn("Add chapter", function () { addChapter(); }, "primary"),
      btn("Generate table of contents", function () { showToc(); }),
      btn("Rebuild list", function () { A().render(); })
    ]));

    var tree = U.el("div", { class: "outline-tree" });
    var byPart = U.groupBy(b.chapters, function (c) { return c.partId || ""; });
    (byPart[""] || []).forEach(function (ch, i) { tree.appendChild(chapterRow(b, ch, 0, i)); });
    (b.parts || []).slice().sort(function (x, y) { return (x.order || 0) - (y.order || 0); }).forEach(function (part) {
      tree.appendChild(partRow(b, part));
      var list = U.el("div", { class: "outline-children" });
      (byPart[part.id] || []).forEach(function (ch, i) { list.appendChild(chapterRow(b, ch, 1, i)); });

    });

    wrap.appendChild(U.el("div", { class: "panel-block" }, [tree]));
    return wrap;
  }

  function partRow(b, part) {
    var row = U.el("div", { class: "outline-row", draggable: "true" });
    row.dataset.partId = part.id;
    row.appendChild(U.el("span", { class: "grip", text: "⠿" }));
    row.appendChild(U.el("span", { class: "otype", text: "Part" }));
    row.appendChild(U.el("span", { class: "otitle", text: part.title }));
    row.appendChild(U.el("span", { class: "ostats", text: (b.chapters.filter(function (c) { return c.partId === part.id; }).length) + " chapters" }));
    row.appendChild(U.el("div", { class: "actions" }, [
      btn("Rename", function () { renamePart(part); }), 
      btn("Delete", function () { deletePart(part); }, "danger")
    ]));
    row.addEventListener("dragstart", function (e) {
      e.dataTransfer.setData("text/bf-part", part.id);
    });
    row.addEventListener("dragover", function (e) { e.preventDefault(); row.classList.add("dragover"); });
    row.addEventListener("dragleave", function () { row.classList.remove("dragover"); });
    row.addEventListener("drop", function (e) {
      e.preventDefault();
      row.classList.remove("dragover");
      var chId = e.dataTransfer.getData("text/bf-chapter");
      if (chId) {
        var ch = b.chapters.filter(function (c) { return c.id === chId; })[0];
        if (ch) { ch.partId = part.id; A().markDirty(); A().render(); }
      }
    });
    return row;
  }

  function chapterRow(b, ch, depth, index) {
    var row = U.el("div", { class: "outline-row", draggable: "true" });
    if (ch.id === S.chapterId) row.classList.add("selected");
    row.dataset.chapterId = ch.id;
    row.appendChild(U.el("span", { class: "grip", text: "⠿" }));
    row.appendChild(U.el("span", { class: "otype", text: "Chapter" }));
    row.appendChild(U.el("span", { class: "otitle", text: ch.title }));
    row.appendChild(U.el("span", { class: "ostats", text: BF.model.chapterWords(ch).toLocaleString() + " words" }));
    row.appendChild(U.el("div", { class: "actions" }, [
      btn("Open", function () { A().openChapter(ch.id); }),
      btn("↑", function () { moveChapter(b, ch, -1); }),
      btn("↓", function () { moveChapter(b, ch, 1); }),
      btn("Indent", function () { cyclePart(b, ch); }, "ghost"),
      btn("Rename", function () { renameChapter(ch); }),
      btn("Duplicate", function () { duplicateChapter(b, ch); }),
      btn("Delete", function () { deleteChapter(b, ch); }, "danger")
    ]));
    row.addEventListener("click", function (e) {
      if (e.target.closest("button")) return;
      S.chapterId = ch.id;
      A().render();
    });
    row.addEventListener("dragstart", function (e) {
      row.classList.add("dragging");
      e.dataTransfer.setData("text/bf-chapter", ch.id);
    });
    row.addEventListener("dragend", function () { row.classList.remove("dragging"); });
    row.addEventListener("dragover", function (e) { e.preventDefault(); row.classList.add("dragover"); });
    row.addEventListener("dragleave", function () { row.classList.remove("dragover"); });
    row.addEventListener("drop", function (e) {
      e.preventDefault();
      row.classList.remove("dragover");
      var otherId = e.dataTransfer.getData("text/bf-chapter");
      var partId = e.dataTransfer.getData("text/bf-part");
      if (otherId && otherId !== ch.id) {
        var other = b.chapters.filter(function (c) { return c.id === otherId; })[0];
        if (!other) return;
        sortChapters(b);
        b.chapters = b.chapters.filter(function (c) { return c.id !== otherId; });
        var idx = b.chapters.indexOf(ch);
        other.partId = ch.partId;
        b.chapters.splice(idx, 0, other);
        sortChapters(b);
        A().markDirty();
        A().render();
      } else if (partId) {
        ch.partId = partId;
        A().markDirty();
        A().render();
      }
    });

    var box = U.el("div", {});
    box.appendChild(row);
    var headings = BF.model.headingsFromHtml(ch.content);
    if (depth === 0 || depth === 1) {
      var list = U.el("div", { class: "outline-children" });
      headings.forEach(function (h) {
        list.appendChild(U.el("div", { class: "outline-row" }, [
          U.el("span", { class: "otype", text: "H" + h.level }),
          U.el("span", { class: "otitle", text: h.text || "(untitled heading)" })
        ]));
      });
      if (!headings.length) list.appendChild(U.el("div", { class: "outline-row" }, [U.el("span", { class: "otype", text: "—" }), U.el("span", { class: "otitle muted", text: "No headings in this chapter yet" })]));
      box.appendChild(list);
    }
    return box;
  }

  function addPart() {
    A().promptDialog({ title: "Add part", label: "Part title", value: "Part " + (book().parts.length + 1) }).then(function (v) {
      if (!v) return;
      book().parts.push({ id: U.uid("part"), title: v, order: book().parts.length + 1 });
      A().markDirty();
      A().render();
    });
  }

  function addChapter() {
    var b = book();
    A().promptDialog({ title: "Add chapter", label: "Chapter title", value: "Chapter " + (b.chapters.length + 1) }).then(function (v) {
      if (!v) return;
      var ch = BF.model.createChapter(v, { order: b.chapters.length + 1 });
      b.chapters.push(ch);
      S.chapterId = ch.id;
      A().markDirty();
      A().render();
    });
  }

  function renameChapter(ch) {
    A().promptDialog({ title: "Rename chapter", label: "Chapter title", value: ch.title }).then(function (v) {
      if (!v) return;
      ch.title = v;
      A().markDirty();
      A().render();
    });
  }

  function renamePart(part) {
    A().promptDialog({ title: "Rename part", label: "Part title", value: part.title }).then(function (v) {
      if (!v) return;
      part.title = v;
      A().markDirty();
      A().render();
    });
  }

  function deletePart(part) {
    var b = book();
    A().confirmDialog({
      title: "Delete part",
      message: "Delete \"" + part.title + "\"? Its chapters will be kept and moved out of the part.",
      danger: true, confirmLabel: "Delete part"
    }).then(function (ok) {
      if (!ok) return;
      b.chapters.forEach(function (c) { if (c.partId === part.id) c.partId = null; });
      b.parts = b.parts.filter(function (p) { return p.id !== part.id; });
      A().markDirty();
      A().render();
    });
  }

  function moveChapter(b, ch, delta) {
    sortChapters(b);
    var idx = b.chapters.indexOf(ch);
    var target = idx + delta;
    if (target < 0 || target >= b.chapters.length) return;
    var other = b.chapters[target];
    var targetPart = other.partId;
    b.chapters.splice(idx, 1);
    b.chapters.splice(target, 0, ch);
    ch.partId = targetPart;
    sortChapters(b);
    A().markDirty();
    A().render();
  }

  function cyclePart(b, ch) {
    var parts = b.parts || [];
    if (!parts.length) {
      app.toast("No parts exist yet. Add a part first.");
      return;
    }
    var idx = ch.partId ? parts.findIndex(function (p) { return p.id === ch.partId; }) : -1;
    var next = idx + 1;
    ch.partId = next >= parts.length ? null : parts[next].id;
    A().markDirty();
    A().render();
  }

  function duplicateChapter(b, ch) {
    var copy = U.clone(ch);
    copy.id = U.uid("ch");
    copy.title = ch.title + " (copy)";
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    sortChapters(b);
    b.chapters.splice(b.chapters.indexOf(ch) + 1, 0, copy);
    sortChapters(b);
    A().markDirty();
    A().render();
    app.toast("Chapter duplicated");
  }

  function deleteChapter(b, ch) {
    A().confirmDialog({
      title: "Move chapter to trash",
      message: 'Move "' + ch.title + '" to the trash? You can restore it from the Trash view.',
      danger: true, confirmLabel: "Move to trash"
    }).then(function (ok) {
      if (!ok) return;
      b.chapters = b.chapters.filter(function (c) { return c.id !== ch.id; });
      b.trashChapters = b.trashChapters || [];
      b.trashChapters.push({ chapter: U.clone(ch), deletedAt: Date.now() });
      sortChapters(b);
      if (S.chapterId === ch.id) S.chapterId = b.chapters.length ? b.chapters[0].id : null;
      A().markDirty();
      A().render();
    });
  }

  function showToc() {
    var entries = BF.model.buildToc(book());
    var list = entries.length
      ? U.el("ol", {}, entries.map(function (e) {
        return U.el("li", { style: "margin-left:" + ((e.level - 1) * 16) + "px", text: e.label });
      }))
      : U.el("p", { class: "muted", text: "No entries yet." });
    A().openDialog({
      title: "Table of contents",
      wide: true,
      body: U.el("div", {}, [
        U.el("p", { class: "small muted", text: "Generated from your actual parts, chapters and headings. Nothing is invented." }),
        list
      ]),
      actions: [{ label: "Close", primary: true, onClick: function (close) { close(); } }]
    });
  }

    ])]));

        ]),

        ])])

  function statusBadge(ch) {
    if (ch.status === "final") return badge("Final", "ok");
    if (ch.status === "revised") return badge("Revised", "gold");
    return badge("Draft");
  }

  /* ==================================================================== notes */
  var NOTE_TYPES = function () { return BF.model.NOTE_TYPES; };

  function noteFilters(defaultType) {
    S.noteFilter = S.noteFilter || { type: defaultType || "", q: "" };
    return S.noteFilter;
  }

  function notesView(headTitle, headSub, subset) {
    A();
    var b = book();
    if (!b) return needBook();
    var f = noteFilters(subset);
    var wrap = U.el("div");
    wrap.appendChild(viewHead(headTitle, headSub, [
      btn("New note", function () { noteDialog(null, subset); }, "primary")
    ]));

    var controls = U.el("div", { class: "toolbar" });
    var typeSel = U.el("select", { "aria-label": "Filter by note type" });
    typeSel.appendChild(U.el("option", { value: "", text: "All types" }));
    NOTE_TYPES().filter(function (t) { return !subset || subset.indexOf(t) >= 0; }).forEach(function (t) {
      var o = U.el("option", { value: t, text: t });
      if (f.type === t) o.selected = true;
      typeSel.appendChild(o);
    });
    typeSel.addEventListener("change", function () { f.type = typeSel.value; A().render(); });
    var search = U.el("input", { type: "search", placeholder: "Search notes…", "aria-label": "Search notes" });
    search.value = f.q || "";
    search.addEventListener("input", U.debounce(function () { f.q = search.value; A().render(); }, 250));
    controls.appendChild(typeSel);
    controls.appendChild(search);
    wrap.appendChild(controls);

    var items = b.notes.slice().sort(function (x, y) { return y.updatedAt - x.updatedAt; });
    if (f.type) items = items.filter(function (n) { return n.type === f.type; });
    if (f.q) {
      var q = f.q.toLowerCase();
      items = items.filter(function (n) {
        return (n.title + " " + n.body + " " + (n.tags || []).join(" ")).toLowerCase().indexOf(q) >= 0;
      });
    }
    if (!items.length) {
      wrap.appendChild(U.el("div", { class: "empty" }, [
        U.el("h3", { text: "No notes yet" }),
        U.el("p", { text: "Create research notes, character profiles, quotations, questions or to-dos. Notes can be linked to a chapter." })
      ]));
      return wrap;
    }
    var grid = U.el("div", { class: "grid cols-3" });
    items.forEach(function (n) {
      grid.appendChild(U.el("div", { class: "panel-block" }, [
        U.el("div", { style: "display:flex;justify-content:space-between;gap:8px;align-items:flex-start" }, [
          U.el("b", { text: n.title }),
          badge(n.type)
        ]),
        U.el("p", { class: "small", style: "margin:8px 0;white-space:pre-wrap", text: (n.body || "").slice(0, 320) }),
        (n.tags || []).length ? U.el("div", {}, n.tags.map(function (t) { return U.el("span", { class: "chip", text: "#" + t }); })) : null,
        U.el("div", { class: "small muted", text: (n.chapterId ? "Linked to: " + chapterTitle(b, n.chapterId) + " · " : "") + U.relativeTime(n.updatedAt) }),
        U.el("div", { class: "actions", style: "margin-top:8px" }, [
          btn("Edit", function () { noteDialog(n, subset); }),
          n.attachment ? btn("Attachment", function () { downloadAttachment(n); }) : null,
          btn("Delete", function () { deleteNote(n); }, "danger")
        ])
      ]));
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function research() {

      "Research library",
      "Research notes, quotations and questions with optional file attachments.",
      ["Research note", "Quotation", "Research question", "Topic note"]
    );
  }

  function chapterTitle(b, id) {
    var ch = b.chapters.filter(function (c) { return c.id === id; })[0];
    return ch ? ch.title : "(deleted chapter)";
  }

  function noteDialog(note, subset) {
    var b = book();
    A().formDialog({
      title: note ? "Edit note" : "New note",
      wide: true,
      fields: [
        { name: "title", label: "Title", required: true, value: note ? note.title : "" },
        { name: "type", label: "Type", type: "select", value: note ? note.type : (subset ? subset[0] : "Research note"), options: NOTE_TYPES().map(function (t) { return { value: t, label: t }; }) },
        { name: "body", label: "Note", type: "textarea", rows: 7, value: note ? note.body : "" },
        { name: "tags", label: "Tags (comma separated)", value: note ? (note.tags || []).join(", ") : "" },
        {
          name: "chapterId", label: "Link to chapter", type: "select", value: note ? (note.chapterId || "") : "",
          options: [{ value: "", label: "Not linked" }].concat(b.chapters.map(function (c) { return { value: c.id, label: c.title }; }))
        },
        { name: "attach", label: "Attach a file (max ~2 MB)", type: "file" }
      ],
      submitLabel: note ? "Save note" : "Create note",
      onSubmit: async function (v) {
        var target = note || { id: U.uid("nt"), createdAt: Date.now() };
        target.title = v.title;
        target.type = v.type;
        target.body = v.body;
        target.tags = String(v.tags || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        target.chapterId = v.chapterId || null;
        target.updatedAt = Date.now();
        var file = v.attach && v.attach.files && v.attach.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) { app.toast("Attachment is larger than 2 MB.", "error"); return false; }
          var url = await U.fileToDataUrl(file);
          target.attachment = { name: file.name, mime: file.type, size: file.size, dataUrl: url };
        }
        if (!note) b.notes.push(target);
        A().markDirty();
        A().render();
      }
    });
  }

  function downloadAttachment(note) {
    var a = note.attachment;
    if (!a) return;
    if (a.dataUrl && a.dataUrl.indexOf("data:") === 0) {
      var parsed = U.dataUrlToBytes(a.dataUrl);
      U.download(new Blob([parsed.bytes], { type: a.mime }), a.name);
    } else {
      app.toast("The attachment data is not available.", "error");
    }
  }

      b.notes = b.notes.filter(function (n) { return n.id !== note.id; });
      A().markDirty();
      A().render();
    });

    var bib = U.el("div", { class: "panel-block" }, [
